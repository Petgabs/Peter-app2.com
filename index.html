    for(const path of paths){

    }else note('Report data checks need a school account sign-in.');
  }
  // 3. GitHub token (optional backend; only a problem when GitHub is in use)
  if(!syncConfig.token){
    note('Optional GitHub data backend: not set up on this device — report data uses the school cloud. Add a private repository + token only if you also want the GitHub copy.');
  }else{
    try{
      const who=await ghApi('https://api.github.com/user',{},syncConfig.token);
      if(!who.ok)add(false,'GitHub token rejected (HTTP '+who.status+').');
      else{const u=await who.json();note('GitHub token signs in as @'+(u.login||'?')+'.');}
      for(const pair of [[syncConfig.repo,'Data'],[deployConfig.websiteRepo,'Website']]){
        const r=pair[0];if(!r)continue;
        const res=await ghApi('https://api.github.com/repos/'+r,{},syncConfig.token);
        if(res.status===404||res.status===403){
          if(pair[1]==='Data'){
            add(false,'Data repository '+r+' is not available to this token — create it private (https://github.com/new?name='+String(r.split('/')[1]||'report-data')+'&visibility=private) and add it under the token’s Repository access, or disconnect GitHub if you only use the school cloud.');
          }else add(false,pair[1]+' repository '+r+' is not available to this token — add '+r+' to its Repository access (Contents: Read and write).');
          continue;
        }
        if(!res.ok){add(false,pair[1]+' repository '+r+': HTTP '+res.status+'.');continue;}
        const meta=await res.json();
        add(ghRepoPerms(meta),pair[1]+' repository '+r+': '+(ghRepoPerms(meta)?'read + write':'read only — needs Contents: Read and write'));
      }
    }catch(err){add(false,'GitHub check failed: '+((err&&err.message)||err));}
  }
  if(box){box.textContent=lines.join('\n');box.className='notice '+(bad?'red':'blue');}
  toast(bad?'Cloud setup has '+bad+' problem'+(bad>1?'s':'')+' — see the check result.':'Cloud setup looks complete.');
}

}
function selectHTML(name,value,opts,placeholder='Select…'){return `<select name="${name}"><option value="">${placeholder}</option>${opts.map(opt=>`<option value="${escapeHTML(opt)}" ${value===opt?'selected':''}>${escapeHTML(opt)}</option>`).join('')}</select>`;}
function renderEditor(){const sub=data.subjects.find(x=>x.id===ui.subjectId),st=data.students.find(x=>x.id===ui.editStudentId);if(!sub||!st){ui.editStudentId=null;return renderRoster();}const r=getReport(st.id,sub.id),students=roster(sub.id),draft=loadDrafts()[st.id+':'+sub.id];if(draft){r.criteriaGrades=Array.isArray(draft.criteriaGrades)?draft.criteriaGrades:r.criteriaGrades;r.overallGrade=draft.overallGrade||r.overallGrade;r.profile=Array.isArray(draft.profile)?draft.profile:r.profile;r.comment=typeof draft.comment==='string'?draft.comment:r.comment;}const pos=students.findIndex(x=>x.id===st.id);return `<div class="crumb"><button data-action="back-subjects">Subject entry</button> / <button data-action="back-roster">${escapeHTML(sub.name)}</button> / ${escapeHTML(label(st))}</div><div class="editor-top"><div><p class="eyebrow">${escapeHTML(sub.code)} · Student ${pos+1} of ${students.length}</p><h1>${escapeHTML(label(st))}</h1><p class="lead">${escapeHTML(sub.name)} · ${escapeHTML(sub.teachers||'Teacher not assigned')}</p></div><span class="soft-tag ${completeReport(st,sub)?'green':'gold'}">${completeReport(st,sub)?'Complete':'In progress'}</span></div><form id="teacher-report-form" data-student="${escapeHTML(st.id)}" data-subject="${escapeHTML(sub.id)}"><div class="editor-grid"><div><section class="section-card"><div class="card-title"><div><h2>Learning criteria</h2><p>Choose an A–E achievement level for every criterion.</p></div></div>${sub.criteria.length?sub.criteria.map((text,i)=>`<div class="criterion-row"><span><strong style="color:var(--gold);margin-right:6px">${String(i+1).padStart(2,'0')}</strong>${escapeHTML(text)}</span>${selectHTML('crit_'+i,r.criteriaGrades[i]||'',GRADES,'—')}</div>`).join(''):'<div class="notice red">No learning criteria configured. Ask admin to add criteria for this subject.</div>'}</section><section class="section-card"><div class="card-title"><div><h2>Teacher comment</h2><p>Write the student's strengths, areas for development and next steps.</p></div></div><div class="field"><label for="comment-box">Comment for ${escapeHTML(st.english)}</label><textarea id="comment-box" name="comment" rows="12" maxlength="3000" spellcheck="true" placeholder="Write the student comment here…">${escapeHTML(r.comment)}</textarea><small>Blank lines create paragraphs. A line beginning <span class="code">##</span> becomes a small heading; a line beginning <span class="code">-</span> becomes a bullet. Maximum 3,000 characters; review the report preview before printing.</small></div></section></div><div><section class="section-card"><h2>Overall grade</h2><p class="lead" style="margin-bottom:12px">Awarded across the course; this is separate from the learner profile.</p><div class="field"><label for="overall-select">A–E grade</label><div id="overall-select">${selectHTML('overallGrade',r.overallGrade,GRADES)}</div></div><div class="divider"></div><h2>Learner profile</h2><p class="lead" style="margin-bottom:14px">Select a frequency rating for each area.</p>${PROFILE_LABELS.map((text,i)=>`<div class="profile-edit-row"><div>${escapeHTML(text.split(':')[0])}<div class="desc">${escapeHTML(text.split(':').slice(1).join(':').trim())}</div></div>${selectHTML('profile_'+i,r.profile[i]||'',Object.keys(RATING))}</div>`).join('')}</section><div class="notice blue">The A–E cohort distribution in the final report is calculated automatically from all enrolled students' overall grades. ${cohort(sub.id).graded}/${cohort(sub.id).total} are currently graded.</div></div></div><div class="sticky-actions"><div class="editor-status" id="editor-status">${draft?`A draft from ${escapeHTML(fmtStamp(draft.savedAt))} was restored — it is saved automatically on this device as you type.`:(r.updatedAt?`Last saved ${escapeHTML(fmtStamp(r.updatedAt))}. Drafts are also kept automatically on this device as you type.`:'Changes are saved when you click Save. Drafts are kept automatically on this device as you type.')}</div><div class="actions"><button type= function renderReports(){
 const selected=data.students.find(x=>x.id===ui.reportStudentId)||sortedStudents()[0];
 if(selected)ui.reportStudentId=selected.id;
 const issues=selected?issueList(selected):[];

 const checklist=!selected?'<p class="lead">Select a student to check report readiness.</p>':issues.length?`<div class="notice" style="margin-top:14px"><strong>${issues.length} item${issues.length===1?'':'s'} need attention.</strong> You can preview or print a clearly marked draft, but the final report should be completed first.</div><ul style="font-size:12px;color:#526278;line-height:1.7;padding-left:20px">${issues.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ul>`:'<div class="notice blue" style="margin-top:14px"><strong>Ready.</strong> All required fields are complete and each subject’s cohort grade distribution is final.</div>';

}

|'main')}" placeholder="main" required></div><div class="field full"><label for="sync-token">Fine-grained access token</label><input id="sync-token" name="token" type="password" value="${escapeHTML(cfg.token||'')}" placeholder="github_pat_…" autocomplete="off"><small>Contents: Read and write on the data repository. The token is shared with signed-in staff through the school cloud so GitHub stays on for teachers; it is never written to the public website.</small></div></div><div class="form-actions"><button type="button" class="btn btn-secondary" data-action="sync-test">Test connection</button><button type="submit" class="btn btn-primary">Save and connect</button><a class="btn btn-secondary" href="https://github.com/new?name=report-data&visibility=private" target="_blank" rel="noopener">Create private data repository ↗</a><button type="button" class="btn btn-danger" data-action="sync-disconnect" data-backend="github">Disconnect</button></div></form><div class="notice" id="sync-test-result" hidden></div>`;return `<div class="page-heading"><div><p class="eyebrow">Cloud sync</p><h1>Share report data through the cloud</h1><p class="lead">Choose where report data lives. Whichever backend you pick, data is encoded as JSON and synced straight to the cloud — the browser keeps only a cache, and every device works on the same shared records.</p></div></div>${backendCard('supabase','School cloud (Supabase) · recommended','Teachers sign in with school-issued usernames and passwords — no GitHub accounts needed. Data is stored in the school\u2019s private database with real access control.',sbForm)}${backendCard('github','GitHub repository (optional)','For technical setups: encoded JSON committed to a private GitHub repository using a fine-grained access token.',ghForm)}<section class="section-card"><div class="card-title"><div><h2>Shared device setup (admin)</h2><p>Publish the Supabase connection and GitHub settings once — every computer that opens this website then configures itself automatically.</p></div><span class="soft-tag green">Admin</span></div><div class="field-grid"><div class="field full"><label for="deploy-repo">Website repository</label><input id="deploy-repo" value="${escapeHTML(deployConfig.websiteRepo||'Petgabs/Peter-app2.com')}" placeholder="Petgabs/Peter-app2.com"><small>Where <span class="code">cloud-config.json</span> lives. It is committed automatically when you publish, and the website reads it on start-up.</small></div></div><div class="details-list"><div><span>Website file (cloud-config.json)</span><span id="bootstrap-state">${escapeHTML(bootstrapLabel())}</span></div><div><span>Repository token (school cloud registry)</span><span>${sbReady()&&sbSession&&sbSession.role==='admin'?'Ready — shared with staff through the school database':'Sign in with the school admin account'}</span></div><div><span>Supabase URL + anon key (website file)</span><span>${syncConfig.token?'Ready — committed to cloud-config.json':'Needs a GitHub token with Contents access'}</span></div><div><span>Every computer</span><span>${sbReady()?'Schools accounts inherit settings on sign-in':'Inherits from cloud-config.json on start-up'}</span></div></div><div class="form-actions"><button type="button" class="btn btn-primary" data-action="registry-save">Save and publish everywhere</button><button type="button" class="btn btn-secondary" data-action="cloud-check">Check setup</button><button type="button" class="btn btn-secondary" data-action="registry-download">Download cloud-config.json</button></div><div class="notice" id="registry-text">The repository token stays in the school cloud (readable by signed-in staff so their devices can mirror automatically) and is never written to the public website file.</div><div class="notice blue" id="cloud-diagnosis" hidden style="margin-top:12px;white-space:pre-line"></div><p class="muted" style="margin:12px 0 0">First-time deployment without a token: download <span class="code">cloud-config.json</span>, commit it to the website repository, or run <span class="code">deploy.ps1</span> once from Windows PowerShell.</p></section><section class="section-card"><h2>Sync status</h2>${cloudBannerHTML()}<div class="details-list"><div><span>Active backend</span><span>${active==='supabase'?'School cloud (Supabase)':active==='github'?'GitHub repository':'None'}</span></div><div><span>Connection</span><span id="sync-status-text">${escapeHTML(syncState.status==='syncing'&&syncReady()?'Syncing with the cloud…':cloudReason().text)}</span></div><div><span>Last sync</span><span id="sync-last-text">${syncState.lastSync?('Last successful sync: '+fmtStamp(syncState.lastSync)):'No successful sync yet in this browser.'}</span></div><div><span>GitHub cloud</span><span id="sync-mirror-text">${escapeHTML(mirrorLabel())}</span></div><div><span>Where data lives</span><span>${escapeHTML(cloudLabel())}</span></div><div><span>Browser storage</span><span>Temporary cache only</span></div><div><span>Conflict handling</span><span>Newer entry wins · deletions kept as tombstones</span></div></div><p class="sync-note" id="sync-error-text">${syncState.lastError?('Last error: '+escapeHTML(syncState.lastError)):''}</p><div class="divider"></div><h3>Data documents shared by both backends</h3><div class="code-block">data/settings.json       school and signatory settings
data/roster.json         student roster
data/subjects.json       courses and learning criteria
data/summaries.json      optional profile summaries
data/reports/&lt;subject&gt;.json  grades, profile and comment per subject</div><div class="divider"></div><h3>Manual controls</h3><div class="actions"><button class="btn btn-primary" data-action="sync-now">Sync now (pull then push)</button><button class="btn btn-secondary" data-action="sync-pull">Load latest from cloud</button></div></section><section class="section-card"><div class="card-title"><div><h2>Set-up: school cloud (recommended)</h2><p>One-time preparation by the coordinator. Teachers never touch GitHub.</p></div></div><ol class="step-list"><li><span class="step-text"><strong>Create a free Supabase project</strong> at supabase.com (school account).<span class="step-zh" lang="zh-CN">在 supabase.com 创建免费的 Supabase 项目（使用学校账号）。</span></span></li><li><span class="step-text"><strong>Run <span class="code">supabase-setup.sql</span></strong> (in this website repository) in the project's SQL editor — it creates the tables, row security and username sign-in helper.<span class="step-zh" lang="zh-CN">在项目的 SQL 编辑器中运行网站仓库中的 supabase-setup.sql，创建数据表、行级安全和用户名登录辅助函数。</span></span></li><li><span class="step-text"><strong>Create each teacher's account</strong> in Authentication → Users → Add user, with user metadata <span class="code">{"username":"hsc-wang","display_name":"Ms Wang","role":"teacher"}</span>. Use <span class="code">"role":"admin"</span> for the coordinator.<span class="step-zh" lang="zh-CN">在“认证 → 用户 → 添加用户”中为每位教师创建账号，并填写用户元数据；协调员使用 role 为 admin。</span></span></li><li><span class="step-text"><strong>Copy the Project URL and anon key</strong> from Settings → API into the School cloud card above (or the first-time setup on the sign-in page). Repeat on each computer.<span class="step-zh" lang="zh-CN">从“设置 → API”复制项目 URL 和 anon 密钥，填入上方的学校云卡片（或登录页的初始设置）。每台电脑重复一次。</span></span></li><li><span class="step-text"><strong>Teachers sign in with their school account</strong> and work as usual — every save is stored in the school database with their name attached.<span class="step-zh" lang="zh-CN">教师使用学校账号登录并正常录入；每次保存都会连同姓名存入学校数据库。</span></span></li></ol><div class="notice red" style="margin-top:14px"><strong>Sensitive data:</strong> the database stores student names, grades and comments. Only create accounts for authorised staff, remove staff who leave (Authentication → Users → Delete), and never make the project's service-role key public — the app only ever uses the anon key.</div><details style="margin-top:16px"><summary style="cursor:pointer;font-weight:650;color:var(--navy-dark)">Set-up: GitHub repository (optional)</summary><ol class="step-list" style="margin-top:12px"><li><span class="step-text">Create a PRIVATE repository (e.g. <span class="code">Petgabs/report-data</span>) — never the public website repository.</span></li><li><span class="step-text">Add staff as collaborators with Write access.</span></li><li><span class="step-text">Each user creates a fine-grained token: only that repository, Contents: Read and write, then saves it in the GitHub card above.</span></li></ol></details></section>`;}
function renderHelp(){return `<div class="page-heading"><div><p class="eyebrow">Guide</p><h1>Use and publish this app</h1><p class="lead">The app page plus small support files (school images and the PDF renderer in vendor/pdf-libs.js, loaded only when a PDF is downloaded): no build tools or server-side code are required.</p></div></div><div class="help-grid"><section class="section-card"><h2>Launch on GitHub Pages</h2><ol><li>Create a GitHub repository (preferably for the app code only).</li><li>Upload this file as <span class="code">index.html</span> to the repository root.</li><li>In Settings → Pages, choose “Deploy from a branch,” then select the main branch and root folder.</li><li>Open the published URL over HTTPS and configure the report year in Admin.</li><li><strong>Never commit exported JSON files</strong>; they contain confidential student records.</li></ol><div class="notice blue">The GitHub page hosts the app code only. Report data lives in the school cloud (Supabase) or a private data repository when Cloud sync is connected (see the Cloud sync page); otherwise it stays in each browser's cache.</div></section><section class="section-card"><h2>Preview and download PDFs</h2><ol><li>For a single-subject report, open Subject entry → your course, or Admin → Reports by subject. Choose a student’s <strong>Preview</strong> or <strong>Download PDF</strong>.</li><li>To see the entire subject’s grades and teacher comments, choose <strong>Preview class overview</strong> or <strong>Download class PDF</strong>.</li><li>For a complete multi-subject student report, open Generate reports. Its preview has both <strong>Download PDF</strong> and <strong>Generate PDF / Print</strong> controls.</li><li>One-click PDF downloads are created locally in the browser; no data is uploaded. Review the PDF before sharing it.</li><li>For the browser print option, select A4, Save as PDF, margins None, no browser headers/footers, and Background graphics on.</li></ol><p class="footer-note">One-click PDFs contain high-resolution rendered pages. The print option is useful if you require selectable PDF text.</p></section><section class="section-card"><h2>Data protection</h2><p class="lead">Student information, subject PDFs and class PDFs are sensitive. Local storage is not an authenticated database. The teacher and admin sign-in screens are a local in-page gate, not server-side security.</p><ul style="font-size:12px;color:#526278;line-height:1.7;padding-left:19px"><li>Use school-managed devices and approved private channels for JSON and PDF files.</li><li>Remove school accounts and GitHub access when staff leave, and never share the Supabase service-role key.</li><li>Export backups frequently and retain them according to school policy.</li><li>Clear browser data only after safely exporting a backup.</li><li>Connect Cloud sync so all teachers share one school-cloud database (Supabase) with real sign-in and access control; a private GitHub repository is the optional alternative.</li></ul></section><section class="section-card"><h2>Report content</h2><p class="lead">The full report follows the Year 11 Preliminary sample. Subject extracts show one student’s course results and comment; class reports combine the cohort overview and all teacher comments.</p><div class="divider"></div><div class="details-list"><div><span>Default year</span><span>${escapeHTML(data.academicYear)}</span></div><div><span>Default subjects</span><span>${data.subjects.length} editable courses</span></div><div><span>Report format</span><span>A4 · one-click PDF or print</span></div></div></section></div>`;}
/* ---------- A4 report rendering ---------- */
function levelName(g){return SEED.achievementLevels.find(x=>x[0]===g)?.[1]||'';}
function fromLines(str){return String(str||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);}
function naturalList(arr){if(!arr.length)return '';if(arr.length===1)return arr[0];return arr.slice(0,-1).join(', ')+' and '+arr.at(-1);}
function autoSummary(st,subs){const high=subs.filter(s=>['A','B'].includes(getReport(st.id,s.id).overallGrade)).map(s=>s.name),develop=subs.filter(s=>['D','E'].includes(getReport(st.id,s.id).overallGrade)).map(s=>s.name);const overview=high.length?`${st.english} has demonstrated strong academic achievement in ${naturalList(high)}. The subject reports below provide a course-by-course account of achievement and learning habits.`:`This report brings together ${st.english}'s Year 11 Preliminary achievement and learning profile across the subjects studied.`;const strengths=high.length?high.slice(0,3).map(x=>`Achievement in ${x}.`):['Review the subject-specific teacher comments to identify demonstrated strengths.'];const consistent=PROFILE_LABELS.map((x,i)=>({name:x.split(':')[0],count:subs.filter(s=>getReport(st.id,s.id).profile[i]==='Consistently').length})).filter(x=>x.count>=Math.max(1,Math.ceil(subs.length/2)));if(consistent.length)strengths.push(`Consistent ${consistent.map(x=>x.name.toLowerCase()).join(' and ')} across reported courses.`);const development=develop.length?develop.slice(0,3).map(x=>`Further consolidation in ${x}.`):['Continue to follow the next steps identified in the subject teacher comments.'];const lower=PROFILE_LABELS.map((x,i)=>({name:x.split(':')[0],count:subs.filter(s=>['Occasionally','Rarely'].includes(getReport(st.id,s.id).profile[i])).length})).filter(x=>x.count>0);if(lower.length)development.push(`Build greater consistency in ${lower.map(x=>x.name.toLowerCase()).join(' and ')}.`);return {overview,strengths,development};}
function reportSummary(st,subs){const auto=autoSummary(st,subs),manual=data.summaries[st.id]||{};return {overview:manual.overview?.trim()||auto.overview,strengths:fromLines(manual.strengths).length?fromLines(manual.strengths):auto.strengths,development:fromLines(manual.development).length?fromLines(manual.development):auto.development};}
function reportCover(st,subs,draft){const total=subs.reduce((n,s)=>n+Number(s.units||0),0);return `<div class="cover-brand"><img class="cover-emblem" src="${SEED.assets.emblem}" alt="School emblem"><img class="cover-name" src="${SEED.assets.schoolName}" alt="${escapeHTML(data.schoolEn)}"></div><div class="cover-top-rule"></div><div class="cover-title"><div class="kicker">Senior Secondary • Stage 6</div><div class="yearline">Year 11 - Preliminary</div><div class="mainline">Student Report</div></div><div class="cover-bottom-rule"></div><div class="cover-academic">Academic Year ${escapeHTML(data.academicYear)}</div><div class="cover-names"><div><div class="lab">Student Name (Pinyin)</div><div class="val">${escapeHTML(st.pinyin)}</div></div><div><div class="lab">English Name</div><div class="val">${escapeHTML(st.english)}</div></div></div><div class="cover-details"><div><div class="lab">Year & Stage</div><div class="val">Year 11 - Preliminary</div></div><div><div class="lab">Reporting Period</div><div class="val">${escapeHTML(data.period||'Academic Year '+data.academicYear)}</div></div><div><div class="lab">Date of Issue</div><div class="val">${escapeHTML(fmtDate(data.issueDate))}</div></div></div><div class="cover-courses"><div class="cover-courses-title">Courses Reported · Preliminary Unit Load</div><table><th scope="col"ead><tr><th scope="col" style="width:15mm;text-align:center">No.</th><th scope="col">Subject</th><th scope="col" style="width:26mm;text-align:center">Units</th></tr></thead><tbody>${subs.map((s,i)=>`<tr><td class="num">${String(i+1).padStart(2,'0')}</td><td>${escapeHTML(s.name)}</td><td class="units">${unitsText(s.units)}</td></tr>`).join('')}<tr class="total"><td colspan="2">Total Preliminary Units Earned</td><td>${unitsText(total)}</td></tr></tbody></table></div><div class="cover-note">This report presents a summary of ${escapeHTML(st.english)}'s academic achievement, learning profile and teacher comments for each course studied in the Year 11 Preliminary program. It should be read in conjunction with the assessment schedule and the school's reporting policy.</div><div class="cover-office">Senior Secondary Academic Office · ${escapeHTML(data.schoolEn)}</div><div class="cover-footer">This report is confidential and is intended for the student and their parent or guardian.</div>${draft?'<div class="draft-mark">DRAFT</div>':''}`;}
function partHead(label,title,text){return `<div class="part-head rpt-block"><div class="mini">${escapeHTML(label)}</div><h2>${escapeHTML(title)}</h2><div class="rule"></div><p>${escapeHTML(text)}</p></div>`;}
function subjectBand(s,index,grade){const staff=String(s.teachers||'Teacher not set');return `<div class="rpt-band"><div class="number">${String(index+1).padStart(2,'0')}</div><div class="subject-name"><strong>${escapeHTML(s.name)}</strong><small><b>Subject Teacher${staff.includes(' and ')?'s':''} ·</b> ${escapeHTML(staff)}</small></div>${grade?`<div class="band-grade">Overall Grade&nbsp; ${escapeHTML(grade||'—')}</div>`:''}</div>`;}
function rptAchievement(st,s,index){const r=getReport(st.id,s.id),co=cohort(s.id);return `<section class="rpt-block rpt-achievement">${subjectBand(s,index,false)}<table class="rpt-table rpt-criteria"><colgroup><col><col style="width:23.5mm"></colgroup><th scope="col"ead><tr><th scope="col">Learning Criteria</th><th scope="col">Achievement</th></tr></thead><tbody>${s.criteria.length?s.criteria.map((c,i)=>`<tr><td>${escapeHTML(c)}</td><td>${escapeHTML(r.criteriaGrades[i]||'—')}</td></tr>`).join(''):'<tr><td>Learning criteria not yet configured.</td><td>—</td></tr>'}</tbody></table><div class="rpt-cap">Overall Grade · Cohort Distribution (Number of Students / Cohort)</div><table class="rpt-table rpt-overall"><colgroup><col style="width:33mm">${GRADES.map(()=>'<col>').join('')}</colgroup><tr><td class="big">${escapeHTML(r.overallGrade||'—')}</td>${GRADES.map(g=>`<td class="${r.overallGrade===g?'selected':''}"><span>${g}</span>${co.counts[g]}/${co.total}</td>`).join('')}</tr></table><div class="rpt-cap">Learner Profile</div><table class="rpt-table rpt-profile"><colgroup><col><col style="width:54mm"></colgroup><tbody>${PROFILE_LABELS.map((x,i)=>`<tr><td>${escapeHTML(x)}</td><td>${escapeHTML(r.profile[i]||'Not set')}&nbsp;&nbsp; <span class="dots">${DOTS[RATING[r.profile[i]]]||'○○○○'}</span></td></tr>`).join('')}</tbody></table></section>`;}
function rptResultSummary(st,subs){return `<section class="rpt-block rpt-summary"><h3>Summary of Results</h3><div class="rpt-rule"></div><p class="rpt-intro">The table below summarises the overall grade awarded in each course, together with the distribution of overall grades across the cohort for that course.</p><table class="rpt-table rpt-results"><colgroup><col style="width:72mm"><col style="width:20mm">${GRADES.map(()=>'<col>').join('')}</colgroup><th scope="col"ead><tr><th scope="col" style="text-align:left">Course</th><th scope="col">Overall<br>Grade</th>${GRADES.map(g=>`<th scope="col">${g}</th>`).join('')}</tr></thead><tbody>${subs.map((s,i)=>{const co=cohort(s.id),r=getReport(st.id,s.id);return `<tr><td><span class="name-no">${String(i+1).padStart(2,'0')}</span>${escapeHTML(s.name)}</td><td style="font:700 9.5pt Georgia,serif;color:var(--navy)">${escapeHTML(r.overallGrade||'—')}</td>${GRADES.map(g=>`<td class="${r.overallGrade===g?'selected':''}">${co.counts[g]}/${co.total}</td>`).join('')}</tr>`}).join('')}<tr class="footer-row"><td>Cohort of Record</td><td colspan="6">Counts show graded students / students enrolled in each course. ${subs.some(s=>cohort(s.id).graded<cohort(s.id).total)?'Draft: some overall grades are not yet entered.':''}</td></tr></tbody></table></section>`;}
function rptProfileSummary(st,subs){const x=reportSummary(st,subs);return `<section class="rpt-block rpt-profile-summary"><h3>Profile Summary</h3><div class="rpt-rule"></div><p>${escapeHTML(x.overview)}</p><div class="summary-panels"><div class="summary-panel"><h4>Demonstrated Strengths</h4><ul>${x.strengths.map(t=>`<li>${escapeHTML(t)}</li>`).join('')}</ul></div><div class="summary-panel"><h4>Areas for Development</h4><ul>${x.development.map(t=>`<li>${escapeHTML(t)}</li>`).join('')}</ul></div></div></section>`;}
function parseComment(text){const lines=String(text||'').replace(/\r/g,'').split('\n'),parts=[],para=[];function flush(){if(para.length){parts.push(`<p>${escapeHTML(para.join(' '))}</p>`);para.length=0;}}let inList=false;for(const raw of lines){const line=raw.trim();if(!line){flush();if(inList){parts.push('</ul>');inList=false;}continue;}if(/^#{1,3}\s+/.test(line)){flush();if(inList){parts.push('</ul>');inList=false;}parts.push(`<h4>${escapeHTML(line.replace(/^#{1,3}\s+/,''))}</h4>`);}else if(/^[-•]\s+/.test(line)){flush();if(!inList){parts.push('<ul>');inList=true;}parts.push(`<li>${escapeHTML(line.replace(/^[-•]\s+/,''))}</li>`);}else{if(inList){parts.push('</ul>');inList=false;}para.push(line);}}flush();if(inList)parts.push('</ul>');return parts.join('')||'<p>Teacher comment not yet entered.</p>';}
function rptTeacherComment(st,s,index){const r=getReport(st.id,s.id);return `<section class="rpt-block rpt-teacher">${subjectBand(s,index,r.overallGrade||'—')}<div class="rpt-comment">${parseComment(r.comment)}</div></section>`;}
function rptCourseSummary(st,subs){return `<section class="rpt-block rpt-course-summary"><h3>Course-by-Course Summary</h3><div class="rpt-rule"></div><p class="rpt-intro" style="font-style:normal">The matrix presents each course's overall grade alongside its separately reported learner profile. The two measures offer a concise reference for setting learning goals at the start of Year 12.</p><table class="rpt-table rpt-matrix"><colgroup>${[50,19,22,18,24,24,21].map(n=>`<col style="width:${n}mm">`).join('')}</colgroup><th scope="col"ead><tr><th scope="col" style="text-align:left">Course</th><th scope="col">Overall<br>Grade</th><th scope="col">Behaviour</th><th scope="col">Effort</th><th scope="col">Participation</th><th scope="col">Punctuality</th><th scope="col">Profile<br>Total</th></tr></thead><tbody>${subs.map((s,i)=>{const r=getReport(st.id,s.id);return `<tr><td><span class="name-no">${String(i+1).padStart(2,'0')}</span>${escapeHTML(s.code==='EAL/D'?'English (EAL/D)':s.name)}</td><td style="font:700 9.4pt Georgia,serif;color:var(--navy)">${escapeHTML(r.overallGrade||'—')}</td>${[0,1,2,3].map(k=>`<td class="dots">${DOTS[RATING[r.profile[k]]]||'○○○○'}</td>`).join('')}<td style="font-weight:700;color:var(--navy-dark)">${r.profile.length===4&&r.profile.every(x=>RATING[x])?profileTotal(r):'—'}/16</td></tr>`}).join('')}<tr class="footer-row"><td colspan="7">Profile total = behaviour + effort + participation + punctuality (maximum 16); it is reported separately from the overall grade.</td></tr></tbody></table></section>`;}
function rptAppendixStart(){return `<div class="rpt-appendix">${partHead('Appendix','Achievement Levels and Reporting Notes','The information below explains the grading scale and the learner profile descriptors used throughout this report.')}</div>`;}
function rptLevels(){return `<section class="rpt-block rpt-appendix"><div class="rpt-subtitle">Achievement Levels</div><table class="rpt-table"><colgroup><col style="width:17mm"><col style="width:31mm"><col></colgroup><th scope="col"ead><tr><th scope="col">Level</th><th scope="col">Descriptor</th><th scope="col" style="text-align:left">Description</th></tr></thead><tbody>${SEED.achievementLevels.map(([grade,word,desc])=>`<tr><td class="lv">${grade}</td><td class="descriptor">${escapeHTML(word)}</td><td>${escapeHTML(desc)}</td></tr>`).join('')}</tbody></table></section>`;}
function rptProfileScale(){return `<section class="rpt-block rpt-appendix"><div class="rpt-subtitle">Learner Profile Descriptors</div><table class="rpt-table"><colgroup><col style="width:34mm"><col style="width:30mm"><col></colgroup><th scope="col"ead><tr><th scope="col">Rating</th><th scope="col">Indicator</th><th scope="col" style="text-align:left">Meaning</th></tr></thead><tbody>${SEED.profileScale.map(([word,score,desc])=>`<tr><td class="descriptor">${escapeHTML(word)}</td><td style="text-align:center" class="dots">${DOTS[score]}</td><td>${escapeHTML(desc)}</td></tr>`).join('')}</tbody></table></section>`;}
function rptNotes(){const notes=["The Overall Grade Distribution indicates how many students in the cohort were awarded each overall grade for the reporting period. The format is 'number of students / cohort'. For example, 'A 3/20' indicates that three students out of a cohort of twenty received an overall grade of A; the denominator is calculated separately for each course.","Learning criteria are reported using the A to E achievement scale described above. The overall grade is determined from performance across all assessment tasks and learning criteria in the course.","The Learner Profile is reported separately from academic achievement and records the student's behaviour, effort, participation and punctuality throughout the reporting period.","Marks and grades in this report reflect achievement to the date of issue and are subject to moderation and external verification."];return `<section class="rpt-block rpt-appendix"><div class="rpt-subtitle" style="border-bottom:.35pt solid var(--border);padding-bottom:1mm">Notes on this report</div><ul class="rpt-notes">${notes.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ul></section>`;}
function rptCertification(st){const staff=[['Class Teacher',st.classTeacher||data.staff.classTeacher],['HSC Coordinator',data.staff.hscCoordinator],['Deputy Principal',data.staff.deputyPrincipal]];return `<section class="rpt-block rpt-appendix"><div class="rpt-subtitle" style="border-bottom:.35pt solid var(--border);padding-bottom:1mm">Report Certification</div><div class="certification">${staff.map(([role,name])=>`<div><div class="sig-line"></div><strong>${escapeHTML(name||'Name not set')}</strong><em>${escapeHTML(role)}</em></div>`).join('')}</div><div class="issue-line">Date of issue: ${escapeHTML(fmtDate(data.issueDate))}</div></section>`;}
function createSheet(pages,st,draft,cover=false){const sheet=document.createElement('section');sheet.className='sheet '+(cover?'sheet-cover':'sheet-standard')+(draft?' draft-sheet':'');sheet.setAttribute('aria-label',cover?'Cover page':'Report page');if(cover){sheet.innerHTML=reportCover(st,enrolled(st),draft);}else{sheet.innerHTML=`<img class="watermark-img" src="${SEED.assets.watermark}" alt="" aria-hidden="true"><div class="sheet-header"><span>${escapeHTML(data.schoolEn)}</span><span>Year 11 - Preliminary Student Report ${escapeHTML(data.academicYear)}</span></div><div class="sheet-body"></div><div class="sheet-footer"><span>${escapeHTML(label(st))} &nbsp; · &nbsp; Year 11 Preliminary Report &nbsp; · &nbsp; Academic Year ${escapeHTML(data.academicYear)}</span><span class="page-n"></span></div>${draft?'<div class="draft-mark">DRAFT</div>':''}`;}pages.appendChild(sheet);return sheet;}
function paginateStudent(st,draft){stage.innerHTML=`<div class="preview-bar"><div><strong>${escapeHTML(label(st))} · Academic Year ${escapeHTML(data.academicYear)}</strong><br><span>${draft?'Draft — incomplete data; do not distribute as final':'Final report preview'} · Save as PDF in your browser</span></div><div class="actions"><button class="btn btn-small btn-secondary" data-action="close-preview">← Back</button><button class="btn btn-small btn-secondary" data-action="print-preview">Generate PDF / Print</button><button class="btn btn-small btn-gold" data-action="download-preview">Download PDF</button></div></div><div class="report-pages"></div>`;document.body.classList.add('preview-mode');const pages=stage.querySelector('.report-pages');const cover=createSheet(pages,st,draft,true);let current=null;const overflow=[];function fitCover(selector,minPt,boundarySelector){const boundary=cover.querySelector(boundarySelector);for(const el of cover.querySelectorAll(selector)){let pt=parseFloat(getComputedStyle(el).fontSize)*.75;const tooTall=()=>el.getBoundingClientRect().bottom>boundary.getBoundingClientRect().top-7;while(pt>minPt&&(el.scrollWidth>el.clientWidth+1||tooTall())){pt-=.5;el.style.fontSize=pt+'pt';}if(el.scrollWidth>el.clientWidth+1||tooTall())overflow.push('Cover text: '+el.textContent.trim().slice(0,30));}}fitCover('.cover-names .val',11,'.cover-details');fitCover('.cover-details .val',8,'.cover-courses');if(cover.querySelector('.cover-courses').getBoundingClientRect().bottom>cover.querySelector('.cover-note').getBoundingClientRect().top-12)overflow.push('Cover course list');function fresh(){current=createSheet(pages,st,draft,false).querySelector('.sheet-body');return current;}function add(html,kind='block'){const holder=document.createElement('div');holder.innerHTML=html;const node=holder.firstElementChild;if(!node)return;if(!current)fresh();current.appendChild(node);if(current.scrollHeight>current.clientHeight+3){current.removeChild(node);if(current.children.length>0)fresh();current.appendChild(node);if(current.scrollHeight>current.clientHeight+3)overflow.push(kind);}}const subs=enrolled(st);fresh();add(partHead('Part One','Academic Achievement','The following pages report, for each course, the learning criteria assessed during the Year 11 Preliminary course, the level of achievement attained against each criterion, the overall grade awarded and the student’s learner profile.'),'Part One heading');subs.forEach((s,i)=>add(rptAchievement(st,s,i),'Achievement: '+s.name));add(rptResultSummary(st,subs),'Summary of Results');add(rptProfileSummary(st,subs),'Profile Summary');fresh();add(partHead('Part Two','Teacher Comments','The comments that follow are provided by the teacher of each course and should be read alongside the achievement data presented in Part One. Comments describe each student’s strengths, areas for development and recommended next steps.'),'Part Two heading');subs.forEach((s,i)=>add(rptTeacherComment(st,s,i),'Comment: '+s.name));add(rptCourseSummary(st,subs),'Course-by-Course Summary');fresh();add(rptAppendixStart(),'Appendix heading');add(rptLevels(),'Achievement Levels');add(rptProfileScale(),'Learner Profile Descriptors');add(rptNotes(),'Notes');add(rptCertification(st),'Certification');const sheets=[...pages.querySelectorAll('.sheet')];sheets.forEach((sheet,i)=>{const f=sheet.querySelector('.page-n');if(f)f.textContent=`Page ${i+1} of ${sheets.length}`;});if(overflow.length){const badge=stage.querySelector('.preview-bar span');badge.textContent+=' · Layout alert: content exceeds a page ('+overflow.join(', ')+'). Shorten text or criteria before printing.';toast('Some report content is too long for a page. Review the preview before printing.','error');}previewState={kind:'full',studentId:st.id,draft,overflow,filename:`${filenamePart(data.academicYear)}-${filenamePart(st.pinyin)}-${filenamePart(st.english)}-Full-Report.pdf`};window.scrollTo(0,0);return overflow;}
/* ---------- Subject extracts, class reports and one-click private PDFs ---------- */
function subjectDraft(st,s){const c=cohort(s.id);return !completeReport(st,s)||!s.teachers.trim()||!data.issueDate||c.graded<c.total;}
function classDraft(s){const students=roster(s.id),c=cohort(s.id);return !students.length||!s.teachers.trim()||!data.issueDate||students.some(st=>!completeReport(st,s))||c.graded<c.total;}
function reportBrand(){return `<div class="subject-report-brand"><img class="subject-report-emblem" src="${SEED.assets.emblem}" alt="School emblem"><img class="subject-report-name" src="${SEED.assets.schoolName}" alt="${escapeHTML(data.schoolEn)}"></div>`;}
function subjectHero(st,s){return `<section class="rpt-block subject-report-hero">${reportBrand()}<div class="subject-report-kicker">Senior Secondary • Stage 6 &nbsp;/&nbsp; Individual Subject Report</div><h2>${escapeHTML(s.name)}</h2><div class="subject-meta"><div><small>Student Name (Pinyin)</small><strong>${escapeHTML(st.pinyin)}</strong></div><div><small>English Name</small><strong>${escapeHTML(st.english)}</strong></div><div><small>Preliminary Units</small><strong>${unitsText(s.units)}</strong></div><div><small>Academic Year / Issue</small><strong>${escapeHTML(data.academicYear)} · ${escapeHTML(fmtDate(data.issueDate))}</strong></div></div><div class="subject-teacher-line">Subject Teacher${s.teachers.includes(' and ')?'s':''} &nbsp;·&nbsp; ${escapeHTML(s.teachers||'Not set')}</div></section>`;}
function subjectComment(st,s){return `<section class="rpt-block subject-report-comment"><div class="rpt-subtitle">Teacher Comment</div><div class="rpt-comment">${parseComment(getReport(st.id,s.id).comment)}</div><div class="subject-comment-sign">${escapeHTML(s.teachers||'Subject Teacher')} &nbsp;·&nbsp; ${escapeHTML(s.name)}</div></section>`;}
function subjectLegend(){return `<section class="rpt-block subject-report-legend"><div class="rpt-subtitle">Reading the results</div><div class="subject-legend-grid"><div><strong>Achievement Scale</strong><p>A Extensive · B Thorough · C Sound · D Basic · E Elementary</p></div><div><strong>Learner Profile</strong><p>●●●● Consistently · ●●●○ Often · ●●○○ Occasionally · ●○○○ Rarely</p></div></div><p>Cohort distribution is displayed as students awarded each overall grade / students enrolled in this subject. Draft reports should not be distributed as final.</p></section>`;}
function classHero(s){const c=cohort(s.id),students=roster(s.id),complete=students.filter(st=>completeReport(st,s)).length;return `<section class="rpt-block subject-report-hero class-report-hero">${reportBrand()}<div class="subject-report-kicker">Senior Secondary • Stage 6 &nbsp;/&nbsp; Subject Class Overview</div><h2>${escapeHTML(s.name)}</h2><div class="class-head-stats"><div><small>Academic Year</small><strong>${escapeHTML(data.academicYear)}</strong></div><div><small>Enrolled</small><strong>${c.total}</strong></div><div><small>Overall Graded</small><strong>${c.graded}/${c.total}</strong></div><div><small>Entries Complete</small><strong>${complete}/${c.total}</strong></div></div><div class="subject-teacher-line">${escapeHTML(s.teachers||'Teacher not set')} &nbsp;·&nbsp; ${unitsText(s.units)} &nbsp;·&nbsp; Issue: ${escapeHTML(fmtDate(data.issueDate))}</div></section>`;}
function classDistribution(s){const c=cohort(s.id);return `<section class="rpt-block class-distribution"><div class="rpt-subtitle">Overall Grade Distribution · Students / Cohort</div><table class="rpt-table"><th scope="col"ead><tr>${GRADES.map(g=>`<th scope="col">${g}</th>`).join('')}</tr></thead><tbody><tr>${GRADES.map(g=>`<td><strong>${c.counts[g]}</strong><span> / ${c.total}</span></td>`).join('')}</tr></tbody></table><p>Counts reflect overall grades entered for the students currently enrolled in this subject. ${c.graded<c.total?'Not all overall grades have been entered; the distribution is provisional.':''}</p></section>`;}
function classRosterTable(){return `<section class="rpt-block class-roster-section"><div class="rpt-subtitle">Enrolled Students · Grade and Learning Profile</div><table class="rpt-table class-roster-table"><colgroup><col style="width:9mm"><col style="width:42mm"><col style="width:29mm"><col style="width:17mm"><col style="width:24mm"><col style="width:25mm"><col style="width:32mm"></colgroup><th scope="col"ead><tr><th scope="col">No.</th><th scope="col" style="text-align:left">Name (Pinyin)</th><th scope="col" style="text-align:left">English Name</th><th scope="col">Grade</th><th scope="col">Criteria</th><th scope="col">Profile</th><th scope="col">Comment</th></tr></thead><tbody></tbody></table></section>`;}

/* The PDF libraries are a 600 KB bundle that only the download path needs, so they
   are fetched once, on demand, from vendor/pdf-libs.js instead of shipping with
   every page load. */
let pdfLibsPromise=null;
function pdfLibsPresent(){return typeof window.html2canvas==='function'&&typeof window.jspdf?.jsPDF==='function';}
function ensurePdfLibs(){
  if(pdfLibsPresent())return Promise.resolve(true);
  if(pdfLibsPromise)return pdfLibsPromise;
  pdfLibsPromise=new Promise(resolve=>{
    const el=document.createElement('script');
    el.src='vendor/pdf-libs.js';el.async=true;
    el.onload=()=>resolve(pdfLibsPresent());
    el.onerror=()=>{pdfLibsPromise=null;resolve(false);};
    document.head.appendChild(el);
  });
  return pdfLibsPromise;
}
async function downloadCurrentPDF(){if(!previewState)return;if(previewState.overflow?.length){alert('Download paused: report content exceeds an A4 page. Please shorten the indicated text and preview again.');return;}if(previewState.draft&&!confirm('Some report data is incomplete. The downloaded PDF will be marked DRAFT. Continue?'))return;if(!(await ensurePdfLibs())){alert('The PDF renderer (vendor/pdf-libs.js) could not be loaded — check the connection and try again, or use Print / Save as PDF instead.');return;}const button=stage.querySelector('[data-action="download-preview"]'),status=stage.querySelector('.preview-bar span');if(button?.disabled)return;const old=button?.textContent;try{if(button){button.disabled=true;button.textContent='Preparing PDF…';}await document.fonts?.ready;const sheets=[...stage.querySelectorAll('.report-pages .sheet')];if(!sheets.length)throw Error('No report pages are available.');const doc=new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});for(let i=0;i<sheets.length;i++){if(button)button.textContent=`Page ${i+1}/${sheets.length}…`;const images=[...sheets[i].querySelectorAll('img')];await Promise.all(images.map(img=>img.complete?Promise.resolve():new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});})));const canvas=await window.html2canvas(sheets[i],{backgroundColor:'#ffffff',scale:2,logging:false,useCORS:true,scrollX:0,scrollY:-window.scrollY});if(canvas.width<100||canvas.height<100)throw Error('A report page could not be rendered.');if(i)doc.addPage('a4','portrait');doc.addImage(canvas.toDataURL('image/jpeg',.94),'JPEG',0,0,210,297,undefined,'FAST');canvas.width=0;canvas.height=0;}doc.save(previewState.filename);toast(`Downloaded ${sheets.length}-page PDF. Keep it private.`);}catch(err){console.error('PDF generation failed:',err);alert('PDF download failed: '+err.message+'\nYou can still use Print / Save as PDF from the preview.');}finally{if(button){button.disabled=false;button.textContent=old;}}}

function cleanStudent(x,subIds){if(!x||typeof x!=='object')throw Error('Invalid student record.');const id=cleanId(x.id,'st'),pinyin=cleanText(x.pinyin,100),english=cleanText(x.english,100),classTeacher=cleanText(x.classTeacher,100);if(!pinyin||!english||!Array.isArray(x.subjectIds))throw Error('A student is missing names or enrolments.');const subjectIds=x.subjectIds.map(y=>cleanId(y,'sub'));if(subjectIds.some(id=>!subIds.has(id))||new Set(subjectIds).size!==subjectIds.length)throw Error('A student is enrolled in a missing or duplicate subject.');return {id,pinyin,english,classTeacher,subjectIds};}
function cleanReport(x,sub){if(!x||typeof x!=='object'||!Array.isArray(x.criteriaGrades)||x.criteriaGrades.length>sub.criteria.length||!Array.isArray(x.profile)||x.profile.length>4)throw Error('An imported report has an invalid grade or profile array.');const criteriaGrades=x.criteriaGrades.map(g=>cleanText(g,1)),overallGrade=cleanText(x.overallGrade,1),profile=x.profile.map(p=>cleanText(p,20)),comment=cleanText(x.comment,3000);if(criteriaGrades.some(g=>g&&!GRADES.includes(g))||(overallGrade&&!GRADES.includes(overallGrade))||profile.some(p=>p&&!RATING[p]))throw Error('An imported report contains grades or ratings outside the defined scales.');return {criteriaGrades,overallGrade,profile,comment,updatedAt:cleanText(x.updatedAt,40)};}
function validateState(x){if(!x||x.version!==1||!Array.isArray(x.students)||!Array.isArray(x.subjects)||!x.reports||typeof x.reports!=='object'||x.students.length>2000||x.subjects.length>100)throw Error('This is not a compatible report-studio backup.');const subjects=x.subjects.map(cleanSubject),subIds=new Set(subjects.map(s=>s.id));if(subIds.size!==subjects.length)throw Error('Duplicate subject IDs in JSON.');const students=x.students.map(st=>cleanStudent(st,subIds)),stIds=new Set(students.map(st=>st.id));if(stIds.size!==students.length)throw Error('Duplicate student IDs in JSON.');const reports={};for(const st of students){if(!x.reports[st.id])continue;const source=x.reports[st.id];if(typeof source!=='object'||Array.isArray(source))throw Error('Invalid subject entries for student.');for(const sid of st.subjectIds){if(source[sid]){if(!reports[st.id])reports[st.id]={};reports[st.id][sid]=cleanReport(source[sid],subjects.find(s=>s.id===sid));}}}const summaries={};for(const st of students){const sum=x.summaries?.[st.id];if(sum){summaries[st.id]={overview:cleanText(sum.overview,1200),strengths:cleanText(sum.strengths,1200),development:cleanText(sum.development,1200)};}}const staff=x.staff||{},tom=x.tombstones||{},entryTomb={};for(const k of Object.keys(tom.entries||{}).slice(0,100)){if(typeof k==='string'&&tom.entries[k]&&typeof tom.entries[k]==='object')entryTomb[k]=cleanStampMap(tom.entries[k]);}return {version:1,schoolEn:cleanText(x.schoolEn,150),schoolCn:cleanText(x.schoolCn,150),academicYear:cleanText(x.academicYear,6),period:cleanText(x.period,150),issueDate:cleanText(x.issueDate,15),settingsUpdatedAt:cleanText(x.settingsUpdatedAt,40),staff:{classTeacher:cleanText(staff.classTeacher,100),hscCoordinator:cleanText(staff.hscCoordinator,100),deputyPrincipal:cleanText(staff.deputyPrincipal,100)},subjects,students,reports,summaries,tombstones:{students:cleanStampMap(tom.students),subjects:cleanStampMap(tom.subjects),entries:entryTomb}};}
function importBackup(packageData){const next=validateState(packageData.data);if(!confirm(`REPLACE all data currently stored in this browser with this backup for ${next.academicYear}? Export a full backup of the current workspace first if you need it.`))return;data=next;ui.view='overview';ui.subjectId=null;ui.editStudentId=null;ui.reportStudentId=null;ui.unsaved=false;persist();render();toast(`Imported full backup: ${data.students.length} students, ${data.subjects.length} subjects.`);}
function cleanRoster(rows){if(!Array.isArray(rows)||rows.length>2000)throw Error('Invalid subject roster.');const seen=new Set();return rows.map(x=>{const id=cleanId(x.id,'st'),pinyin=cleanText(x.pinyin,100),english=cleanText(x.english,100);if(!pinyin||!english||seen.has(id))throw Error('Duplicate or incomplete student in subject roster.');seen.add(id);return {id,pinyin,english};});}
function assertRosterMatches(rows,sub){const local=roster(sub.id);if(local.length!==rows.length)throw Error('Roster does not match the admin workspace. Send the teacher an updated starter.');const byId=new Map(local.map(st=>[st.id,st]));for(const row of rows){const st=byId.get(row.id);if(!st||st.pinyin!==row.pinyin||st.english!==row.english)throw Error('Student IDs or names differ from the admin workspace. Send an updated starter.');}}
function importStarter(pkg){const sub=cleanSubject(pkg.subject),rows=cleanRoster(pkg.roster),year=cleanText(pkg.academicYear,6),schoolEn=cleanText(pkg.schoolEn,150),schoolCn=cleanText(pkg.schoolCn,150),period=cleanText(pkg.period,150);if(!/^20\d\d$/.test(year)||!schoolEn)throw Error('Teacher starter is missing a valid year or school name.');const isFresh=data.students.length===0&&Object.keys(data.reports).length===0;if(!isFresh&&(data.academicYear!==year||data.schoolEn!==schoolEn))throw Error('This starter belongs to a different school or reporting year. Export your existing work and reset this browser before starting a new year.');const existing=data.subjects.find(s=>s.id===sub.id);if(!isFresh&&existing&&(existing.name!==sub.name||existing.code!==sub.code||JSON.stringify(existing.criteria)!==JSON.stringify(sub.criteria)))throw Error('Course criteria differ from the current workspace. Export your current subject entries and start fresh before importing this updated starter.');if(!isFresh){for(const row of rows){const old=data.students.find(st=>st.id===row.id);if(old&&(old.pinyin!==row.pinyin||old.english!==row.english))throw Error('A student name differs from this starter. Resolve the roster on the admin device first.');}}const incomingIds=new Set(rows.map(x=>x.id)),removed=existing?roster(sub.id).filter(st=>!incomingIds.has(st.id)):[];const message=isFresh?'The seven blank example course templates on this browser will be replaced by this one subject.':existing?`Existing entries for enrolled students are kept. ${removed.length} student(s) no longer enrolled in this subject will be removed from its roster and their subject entries deleted.`:'This subject and its roster will be added; other courses and entries remain unchanged.';if(!confirm(`Import the ${sub.name} teacher starter for ${rows.length} students? ${message}`))return;if(isFresh){data=initialState();data.subjects=[];data.students=[];}data.schoolEn=schoolEn;data.schoolCn=schoolCn;data.academicYear=year;data.period=period;if(!data.subjects.some(s=>s.id===sub.id))data.subjects.push(sub);if(removed.length){for(const st of removed){st.subjectIds=st.subjectIds.filter(sid=>sid!==sub.id);delete data.reports[st.id]?.[sub.id];if(!st.subjectIds.length){data.students=data.students.filter(x=>x.id!==st.id);delete data.reports[st.id];delete data.summaries[st.id];}}}for(const row of rows){let st=data.students.find(x=>x.id===row.id);if(!st){st={...row,classTeacher:'',subjectIds:[]};data.students.push(st);}if(!st.subjectIds.includes(sub.id))st.subjectIds.push(sub.id);}ui.unsaved=false;ui.view='subjects';ui.subjectId=sub.id;ui.editStudentId=null;persist();render();toast(`Imported ${sub.name} starter for ${rows.length} students.`);}
function importSubject(pkg){const id=cleanId(pkg.subject?.id,'sub'),sub=data.subjects.find(s=>s.id===id);if(!sub)throw Error('Subject ID is not in this workspace. Restore the admin master backup first.');if(cleanText(pkg.schoolEn,150)!==data.schoolEn||cleanText(pkg.academicYear,6)!==data.academicYear)throw Error('Subject package belongs to another school or academic year.');if(cleanText(pkg.subject.name,150)!==sub.name||cleanText(pkg.subject.code,18)!==sub.code||JSON.stringify(pkg.subject.criteria)!==JSON.stringify(sub.criteria))throw Error('Course name, code or criteria differ from the admin master. Update the teacher starter before importing.');const rows=cleanRoster(pkg.roster);assertRosterMatches(rows,sub);if(!Array.isArray(pkg.entries)||pkg.entries.length>rows.length)throw Error('Invalid subject entries array.');const incoming=[],seen=new Set(),rosterIds=new Set(rows.map(x=>x.id));for(const item of pkg.entries){const stId=cleanId(item.studentId,'st');if(!rosterIds.has(stId)||seen.has(stId))throw Error('Duplicate or unmatched student in subject entries.');seen.add(stId);incoming.push([stId,cleanReport(item.report,sub)]);}if(!incoming.length){toast('This subject package contains no saved entries.','error');return;}const existing=incoming.filter(([id])=>data.reports[id]?.[sub.id]).length;if(!confirm(`Import ${incoming.length} ${sub.name} entries? ${existing} existing entry${existing===1?'':'ies'} will be replaced for this subject only. Other subjects remain unchanged.`))return;for(const [id,report] of incoming){if(!data.reports[id])data.reports[id]={};data.reports[id][sub.id]=report;}ui.unsaved=false;persist();render();toast(`Merged ${incoming.length} subject entries. ${cohort(sub.id).graded}/${cohort(sub.id).total} overall grades now entered.`);}
function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;const src=String(text||'').replace(/^\uFEFF/,'');for(let i=0;i<src.length;i++){const ch=src[i];if(quoted){if(ch==='"'){if(src[i+1]==='"'){cell+='"';i++;}else quoted=false;}else cell+=ch;}else if(ch==='"')quoted=true;else if(ch===','){row.push(cell);cell='';}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&src[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(c=>c.trim()))rows.push(row);row=[];}else cell+=ch;}row.push(cell);if(row.some(c=>c.trim()))rows.push(row);return rows;}
async function readCsvImport(input){const file=input.files?.[0];if(!file)return;try{if(file.size>5*1024*1024)throw Error('CSV file is too large (5 MB limit).');const rows=parseCSV(await file.text());if(!rows.length)throw Error('The CSV file is empty.');const head=rows[0].map(c=>c.trim().toLowerCase());const start=head.some(c=>c.includes('pinyin')||c.includes('english'))?1:0;const byCode=new Map(data.subjects.map(x=>[x.code.toLowerCase(),x.id])),byName=new Map(data.subjects.map(x=>[x.name.toLowerCase(),x.id]));const seen=new Set(data.students.map(st=>(st.pinyin+'|'+st.english).toLowerCase()));const fresh=[];for(const r of rows.slice(start)){const pinyin=String(r[0]||'').trim(),english=String(r[1]||'').trim();if(!pinyin&&!english)continue;if(!pinyin||!english)throw Error('Every CSV row needs both a Pinyin and an English name.');const key=(pinyin+'|'+english).toLowerCase();if(seen.has(key))continue;seen.add(key);const subjectIds=[];for(const token of String(r[3]||'').split(/[;|]/).map(x=>x.trim()).filter(Boolean)){const sid=byCode.get(token.toLowerCase())||byName.get(token.toLowerCase());if(!sid)throw Error('Unknown subject in CSV: '+token+' (use the subject code, e.g. '+(data.subjects[0]?.code||'MAD')+').');if(!subjectIds.includes(sid))subjectIds.push(sid);}fresh.push({id:makeId('st'),pinyin,english,classTeacher:String(r[2]||'').trim(),subjectIds,updatedAt:stampNow()});}if(!fresh.length){toast('No new students in that CSV — everyone listed is already on the roster.','error');return;}if(fresh.length+data.students.length>2000)throw Error('That import would exceed the 2,000-student limit.');createSnapshot('Before importing a CSV roster');data.students.push(...fresh);persist();render();toast('Imported '+fresh.length+' student'+(fresh.length===1?'':'s')+' from CSV.');}catch(err){console.error('CSV import failed:',err);alert('CSV import not completed: '+err.message);toast('CSV import failed. Existing data was not changed.','error');}finally{input.value='';}}
async function readImport(input){const file=input.files?.[0];if(!file)return;try{if(file.size>30*1024*1024)throw Error('JSON file is too large (30 MB limit).');const pkg=JSON.parse(await file.text());if(!pkg||pkg.version!==1)throw Error('Unsupported JSON version.');createSnapshot('Before importing a JSON file');if(pkg.format==='report-studio-backup-v1')importBackup(pkg);else if(pkg.format==='report-studio-starter-v1')importStarter(pkg);else if(pkg.format==='report-studio-subject-v1')importSubject(pkg);else throw Error('This is not a recognised report-studio JSON file.');}catch(err){console.error('Import failed:',err);alert('Import not completed: '+err.message);toast('Import failed. Existing data was not changed.','error');}finally{input.value='';}}
function openReport(id,autoPrint=false){if(!allowLeave())return;const st=data.students.find(x=>x.id===id);if(!st){toast('Select a student first.','error');return;}const issues=issueList(st);if(autoPrint&&issues.length&&!confirm(`This report has ${issues.length} outstanding checklist item${issues.length===1?'':'s'} and will print with a DRAFT mark. Continue?`))return;const overflow=paginateStudent(st,issues.length>0);if(autoPrint){if(overflow.length){alert('Printing is paused because content does not fit on an A4 page. Please shorten the indicated text or criteria before printing.');return;}requestAnimationFrame(()=>requestAnimationFrame(()=>window.print()));}}

document.addEventListener('click',e=>{const trigger=e.target.closest('[data-action]');if(!trigger)return;const action=trigger.dataset.action,id=trigger.dataset.id;if(action==='modal-backdrop'){if(e.target===trigger)closeModal();return;}if(action==='login-as'){ui.loginRole=trigger.dataset.role==='admin'?'admin':trigger.dataset.role==='cloud'?'cloud':'teacher';ui.loginView='form';ui.loginError='';renderLogin();return;}if(action==='login-back'){ui.loginView='choose';ui.loginError='';renderLogin();return;}if(action==='logout'){signOut();return;}if(action==='admin-login'){adminLoginModal();return;}if(action==='sync-test'){testConnection();return;}if(action==='registry-save'){registrySave();return;}if(action==='cloud-check'){runCloudDiagnostics();return;}if(action==='registry-download'){registryDownload();return;}if(action==='sb-test'){testSbConnection();return;}if(action==='sync-now'){syncNow();return;}if(action==='sync-pull'){syncPull();return;}if(action==='sync-disconnect'){disconnectBackend(trigger.dataset.backend||cloudConfig.backend||'github');return;}if(action==='use-backend'){const b=trigger.dataset.backend==='github'?'github':'supabase';if(b==='supabase'&&!sbReady()){toast('Save the school cloud connection first.','error');return;}saveCloudConfig({backend:b});render();toast('Cloud backend set to '+(b==='supabase'?'school cloud':'GitHub')+'.');return;}if(action==='view'){if(!allowLeave())return;if((trigger.dataset.view==='admin'||trigger.dataset.view==='sync')&&authRole!=='admin'){ui.afterAdminLogin=trigger.dataset.view;adminLoginModal();return;}ui.view=trigger.dataset.view;ui.subjectId=null;ui.editStudentId=null;render();window.scrollTo(0,0);}else if(action==='admin-tab'){if(!allowLeave())return;if(authRole!=='admin'){adminLoginModal();return;}ui.view='admin';ui.adminTab=trigger.dataset.tab;ui.subjectId=null;ui.editStudentId=null;render();window.scrollTo(0,0);}else if(action==='student-modal'){if(!allowLeave())return;studentModal(id);}else if(action==='subject-modal'){if(!allowLeave())return;subjectModal(id);}else if(action==='close-modal')closeModal();else if(action==='check-enrolments'){for(const box of modalRoot.querySelectorAll('input[name="subjects"]'))box.checked=trigger.dataset.mode==='all';ui.unsaved=true;}else if(action==='delete-student'){const st=data.students.find(x=>x.id===id);if(st&&confirm(`Remove ${label(st)} and permanently delete all their report entries from this workspace?`)){createSnapshot('Before deleting a student');data.tombstones.students[id]=stampNow();for(const subId of Object.keys(data.reports[id]||{})){if(!data.tombstones.entries[subId])data.tombstones.entries[subId]={};data.tombstones.entries[subId][id]=stampNow();}data.students=data.students.filter(x=>x.id!==id);delete data.reports[id];delete data.summaries[id];persist();render();toast('Student and associated report entries removed.');}}else if(action==='delete-subject'){const sub=data.subjects.find(x=>x.id===id);if(sub&&confirm(`Remove ${sub.name} from every student and delete all entries for this subject?`)){createSnapshot('Before deleting a subject');data.tombstones.subjects[id]=stampNow();if(!data.tombstones.entries[id])data.tombstones.entries[id]={};for(const st of data.students){st.subjectIds=st.subjectIds.filter(sid=>sid!==id);if(data.reports[st.id]?.[id]){delete data.reports[st.id]?.[id];data.tombstones.entries[id][st.id]=stampNow();}}data.subjects=data.subjects.filter(s=>s.id!==id);persist();render();toast('Subject and its entries removed.');}}else if(action==='move-subject'){const ix=data.subjects.findIndex(s=>s.id===id),target=ix+Number(trigger.dataset.dir);if(ix>=0&&target>=0&&target<data.subjects.length){[data.subjects[ix],data.subjects[target]]=[data.subjects[target],data.subjects[ix]];persist();render();}}else if(action==='open-subject'){ui.subjectId=id;ui.editStudentId=null;render();window.scrollTo(0,0);}else if(action==='back-subjects'){if(!allowLeave())return;ui.editStudentId=null;ui.subjectId=null;ui.view='subjects';render();}else if(action==='back-roster'){if(!allowLeave())return;ui.editStudentId=null;render();window.scrollTo(0,0);}else if(action==='edit-entry'){ui.editStudentId=id;render();window.scrollTo(0,0);}else if(action==='preview-subject'||action==='download-subject')openSubjectPreview(id,trigger.dataset.subject,action==='download-subject');else if(action==='preview-class'||action==='download-class')openClassPreview(trigger.dataset.subject,action==='download-class');else if(action==='download-preview')downloadCurrentPDF();else if(action==='snapshot-now'){createSnapshot('Manual snapshot');render();toast('Recovery snapshot saved on this browser.');}else if(action==='snapshot-restore')restoreSnapshot(id);else if(action==='snapshot-download'){const sn=loadSnapshots().find(x=>x.id===id);if(sn)downloadJSON({format:'report-studio-backup-v1',version:1,exportedAt:sn.at,data:sn.data},'Private-SNAPSHOT-'+sn.at.slice(0,10)+'.json');}else if(action==='import-csv')document.getElementById('csv-import')?.click();else if(action==='export-all')exportBackup();else if(action==='export-starter')exportStarter(id);else if(action==='export-subject')exportSubject(id);else if(action==='import-json')document.getElementById('json-import')?.click();else if(action==='reset-all'){if(prompt('This deletes all local student records, grades and comments on this browser. Export a backup first. Type RESET to confirm:')==='RESET'){createSnapshot('Before resetting local data');localStorage.removeItem(STORE_KEY);localStorage.removeItem(DRAFT_KEY);data=initialState();ui.view='overview';ui.subjectId=null;ui.editStudentId=null;ui.unsaved=false;persist();render();toast('Local records reset. The blank 2027 template is ready.');}}else if(action==='preview'||action==='generate-pdf')openReport(id,action==='generate-pdf');else if(action==='close-preview'){document.body.classList.remove('preview-mode');stage.innerHTML='';previewState=null;render();window.scrollTo(0,0);}else if(action==='print-preview'){if(previewState?.overflow?.length){alert('Some content exceeds an A4 page. Please shorten the indicated content before printing.');return;}if(previewState?.draft&&!confirm('This report is marked DRAFT because some data is incomplete. Print the draft anyway?'))return;window.print();}});

document.addEventListener('keydown',e=>{const modal=modalRoot.querySelector('.modal');if(e.key==='Escape'&&modal){e.preventDefault();closeModal();return;}if(e.key==='Tab'&&modal){const focusables=[...modal.querySelectorAll('button:not(:disabled),[href],input:not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex]:not([tabindex="-1"])')].filter(el=>el.offsetParent!==null);if(!focusables.length)return;const first=focusables[0],last=focusables[focusables.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
