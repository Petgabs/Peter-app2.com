/* ---------- GitHub cloud sync: encoded JSON committed to a private data repository ---------- */
const SYNC_KEY='bzgfls-report-studio-github-v1';
const SYNC_CACHE_KEY='bzgfls-report-studio-sync-cache-v1';
const SYNC_DEFAULTS={repo:'Petgabs/report-data',branch:'main',token:'',enabled:false};
function loadSyncConfig(){try{const raw=localStorage.getItem(SYNC_KEY);return raw?{...SYNC_DEFAULTS,...JSON.parse(raw)}:{...SYNC_DEFAULTS};}catch(err){return {...SYNC_DEFAULTS};}}

let syncConfig=loadSyncConfig();
const syncState={status:'idle',lastSync:'',lastError:'',user:'',pushing:false,mirrorAt:'',mirrorError:'',mirroring:false};
function loadSyncCache(){try{const raw=localStorage.getItem(SYNC_CACHE_KEY);return raw?JSON.parse(raw):{};}catch(err){return {};}}
let syncedFiles=loadSyncCache();
function saveSyncCache(){try{localStorage.setItem(SYNC_CACHE_KEY,JSON.stringify(syncedFiles));}catch(err){}}
function syncReady(){return !!transport();}
function ghReady(){return !!(syncConfig.enabled&&syncConfig.token&&/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(syncConfig.repo||''));}
/* ---------- School cloud (Supabase): school-issued accounts, shared data in Postgres ---------- */
const SB_KEY='bzgfls-report-studio-supabase-v1';
const SB_SESSION_KEY='bzgfls-report-studio-sb-session-v1';
const CLOUD_KEY='bzgfls-report-studio-cloud-v1';
const SB_DEFAULTS={url:'',anon:'',enabled:false};
function loadSbConfig(){try{const raw=localStorage.getItem(SB_KEY);return raw?{...SB_DEFAULTS,...JSON.parse(raw)}:{...SB_DEFAULTS};}catch(err){return {...SB_DEFAULTS};}}
function saveSbConfig(cfg){sbConfig={...SB_DEFAULTS,...(cfg||{})};try{localStorage.setItem(SB_KEY,JSON.stringify(sbConfig));}catch(err){}}
let sbConfig=loadSbConfig();
function loadCloudConfig(){try{const raw=localStorage.getItem(CLOUD_KEY);const c=raw?JSON.parse(raw):{};if(c.backend==='supabase'||c.backend==='github')return {backend:c.backend};if(sbConfig.enabled&&sbConfig.url)return {backend:'supabase'};const gh=JSON.parse(localStorage.getItem(SYNC_KEY)||'{}');if(gh.enabled&&gh.token)return {backend:'github'};return {backend:''};}catch(err){return {backend:''};}}
function saveCloudConfig(cfg){cloudConfig={backend:'',...(cfg||{})};try{localStorage.setItem(CLOUD_KEY,JSON.stringify(cloudConfig));}catch(err){}}
let cloudConfig=loadCloudConfig();
function loadSbSession(){try{const raw=localStorage.getItem(SB_SESSION_KEY);return raw?JSON.parse(raw):null;}catch(err){return null;}}
function saveSbSession(s){sbSession=s||null;try{if(s)localStorage.setItem(SB_SESSION_KEY,JSON.stringify(s));else localStorage.removeItem(SB_SESSION_KEY);}catch(err){}}
let sbSession=loadSbSession();
function sbRoot(){return String(sbConfig.url||'').replace(/\/+$/,'');}
function sbReady(){return !!(sbConfig.enabled&&/^https:\/\/.+/.test(sbConfig.url||'')&&sbConfig.anon);}
function sbHeaders(){const h={apikey:sbConfig.anon,'Content-Type':'application/json'};if(sbSession&&sbSession.access_token)h.Authorization='Bearer '+sbSession.access_token;return h;}
async function sbEnsureSession(){
  if(!sbSession)throw Error('Sign in with your school account first.');
  const exp=Number(sbSession.expires_at||0);
  if(exp&&exp-60>Date.now()/1000)return sbSession;
  const res=await fetch(sbRoot()+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:sbConfig.anon,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:sbSession.refresh_token})});
  if(!res.ok){saveSbSession(null);throw Error('School cloud session expired. Sign in again.');}
  const j=await res.json();
  saveSbSession({...sbSession,access_token:j.access_token,refresh_token:j.refresh_token||sbSession.refresh_token,expires_at:Math.floor(Date.now()/1000)+Number(j.expires_in||3600)});
  return sbSession;
}
async function sbLookupEmail(username){
  const res=await fetch(sbRoot()+'/rest/v1/rpc/email_for_username',{method:'POST',headers:{apikey:sbConfig.anon,'Content-Type':'application/json'},body:JSON.stringify({u:String(username||'').trim()})});
  if(!res.ok)return '';
  const j=await res.json();
  return typeof j==='string'?j.trim():'';
}
async function sbSignIn(usernameOrEmail,password){
  const input=String(usernameOrEmail||'').trim();
  const email=input.includes('@')?input:await sbLookupEmail(input);
  if(!email)throw Error('Unknown username. Check with the coordinator.');
  const res=await fetch(sbRoot()+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:sbConfig.anon,'Content-Type':'application/json'},body:JSON.stringify({email,password:String(password||'')})});
  if(!res.ok)throw Error('Incorrect username or password.');
  const j=await res.json();
  saveSbSession({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Math.floor(Date.now()/1000)+Number(j.expires_in||3600),user:{id:j.user&&j.user.id,email:j.user&&j.user.email},role:'teacher',username:'',display_name:''});
  await sbFetchProfile();
  return sbSession;
}
async function sbFetchProfile(){
  if(!sbSession||!sbSession.user)return null;
  const res=await fetch(sbRoot()+'/rest/v1/profiles?id=eq.'+encodeURIComponent(sbSession.user.id)+'&select=role,username,display_name',{method:'GET',headers:sbHeaders()});
  if(res.ok){const rows=await res.json();const p=rows&&rows[0];if(p){sbSession.role=p.role==='admin'?'admin':'teacher';sbSession.username=p.username||'';sbSession.display_name=p.display_name||'';saveSbSession(sbSession);}}
  return sbSession;
}

async function sbListPaths(){
  const res=await fetch(sbRoot()+'/rest/v1/report_files?select=path',{method:'GET',headers:sbHeaders()});
  if(!res.ok)throw Error('School cloud read failed (HTTP '+res.status+').');
  const rows=await res.json();
  return (rows||[]).map(r=>String(r.path||'')).filter(Boolean);
}
async function sbReadOne(path){
  const res=await fetch(sbRoot()+'/rest/v1/report_files?path=eq.'+encodeURIComponent(path)+'&select=content,updated_at',{method:'GET',headers:sbHeaders()});
  if(res.status===404)return null;
  if(!res.ok)throw Error('School cloud read failed (HTTP '+res.status+').');
  const rows=await res.json();
  if(!rows||!rows.length)return null;
  return {payload:(rows[0].content&&typeof rows[0].content==='object')?rows[0].content:{},meta:String(rows[0].updated_at||'')};

function loadDeployConfig(){try{const raw=localStorage.getItem(DEPLOY_KEY);return raw?{websiteRepo:'Petgabs/Peter-app2.com',...JSON.parse(raw)}:{websiteRepo:'Petgabs/Peter-app2.com'};}catch(err){return {websiteRepo:'Petgabs/Peter-app2.com'};}}
function saveDeployConfig(cfg){deployConfig={websiteRepo:'Petgabs/Peter-app2.com',...(cfg||{})};try{localStorage.setItem(DEPLOY_KEY,JSON.stringify(deployConfig));}catch(err){}}

function cloudConfigPublic(){return {version:1,supabaseUrl:sbConfig.url||'',supabaseAnon:sbConfig.anon||'',githubRepo:syncConfig.repo||'',githubBranch:syncConfig.branch||'main',websiteRepo:deployConfig.websiteRepo||'Petgabs/Peter-app2.com'};}
function cloudRegistryFull(){return {...cloudConfigPublic(),githubToken:syncConfig.token||''};}
function chooseBackend(){
  const canSb=!!(sbReady()&&sbSession),canGh=ghReady();
  if(cloudConfig.backend==='supabase'&&canSb)return 'supabase';
  if(cloudConfig.backend==='github'&&canGh)return 'github';
  if(canSb){if(cloudConfig.backend!=='supabase')saveCloudConfig({backend:'supabase'});return 'supabase';}
  if(canGh){if(cloudConfig.backend!=='github')saveCloudConfig({backend:'github'});return 'github';}
  return '';
}
/* GitHub is kept on automatically: when the school cloud is the active backend
   every successful save is mirrored to the repository, using the token that is
   published to staff through the school database. */
async function mirrorToGitHub(){
  if(cloudConfig.backend!=='supabase'||!ghReady()||!sbSession||syncState.mirroring)return;
  syncState.mirroring=true;
  try{
    const payloads=buildSyncPayloads();
    for(const path of Object.keys(payloads)){
      let remote=null;
      try{remote=await ghTransport.readOne(path);}catch(err){remote=null;}
      let merged=payloads[path];
      if(remote&&typeof remote.payload==='object')merged=mergePayload(path,remote.payload,payloads[path]);
      if(!remote||JSON.stringify(remote.payload)!==JSON.stringify(merged))await ghTransport.write(path,merged,remote&&remote.meta);
    }
    syncState.mirrorAt=stampNow();syncState.mirrorError='';
  }catch(err){syncState.mirrorError=String((err&&err.message)||err);console.warn('GitHub mirror failed:',err);}
  finally{syncState.mirroring=false;updateSyncUI();}
}
function applyCloudRegistry(cfg){
  if(!cfg||typeof cfg!=='object')return;
  if(cfg.supabaseUrl&&cfg.supabaseAnon)saveSbConfig({url:String(cfg.supabaseUrl).replace(/\/+$/,''),anon:String(cfg.supabaseAnon),enabled:true});
  if(cfg.githubRepo||cfg.githubBranch||cfg.githubToken)saveSyncConfig({repo:String(cfg.githubRepo||syncConfig.repo),branch:String(cfg.githubBranch||syncConfig.branch||'main'),token:String(cfg.githubToken||syncConfig.token||''),enabled:!!(cfg.githubToken||syncConfig.token)});
  if(cfg.websiteRepo)saveDeployConfig({websiteRepo:String(cfg.websiteRepo)});
  if(!cloudConfig.backend){if(sbReady())saveCloudConfig({backend:'supabase'});else if(syncConfig.enabled&&syncConfig.token)saveCloudConfig({backend:'github'});}
}
const bootstrapState={checked:false,found:false,at:'',error:''};
function bootstrapLabel(){if(!bootstrapState.checked)return 'Not checked yet';if(bootstrapState.found)return 'Found in the website repository';return 'MISSING — new computers start with “Cloud: off”';}
async function loadBootstrapConfig(){
  try{
    const res=await fetch(BOOTSTRAP_FILE,{cache:'no-store'});
    bootstrapState.checked=true;
    if(!res.ok){bootstrapState.found=false;return false;}
    const cfg=await res.json();
    if(!cfg||cfg.version!==1){bootstrapState.found=false;return false;}
    bootstrapState.found=true;bootstrapState.at=new Date().toISOString();
    const before=JSON.stringify({sb:sbConfig,gh:syncConfig,d:deployConfig,c:cloudConfig});
    const merged={...cfg};
    if(merged.supabaseUrl&&(!/^https:\/\/.+/.test(merged.supabaseUrl)||/xxxx/i.test(merged.supabaseUrl))){delete merged.supabaseUrl;delete merged.supabaseAnon;}
    /* The published file is the school-wide source of truth for the Supabase
       project; a stored token is never overwritten from a public file. */
    if(syncConfig.enabled&&syncConfig.token)delete merged.githubToken;
    applyCloudRegistry(merged);
    return JSON.stringify({sb:sbConfig,gh:syncConfig,d:deployConfig,c:cloudConfig})!==before;
  }catch(err){bootstrapState.checked=true;bootstrapState.found=false;bootstrapState.error=String((err&&err.message)||err);return false;}
}
async function pullCloudRegistry(){
  if(!(sbReady()&&sbSession))return false;
  try{
    await sbEnsureSession();
    const res=await fetch(sbRoot()+'/rest/v1/app_config?key=eq.cloud&select=value,updated_at',{method:'GET',headers:sbHeaders()});
    if(!res.ok)return false;
    const rows=await res.json();
    if(!rows||!rows.length||!rows[0].value)return false;
    const before=JSON.stringify({sb:sbConfig,gh:syncConfig,d:deployConfig});
    applyCloudRegistry(rows[0].value);
    return JSON.stringify({sb:sbConfig,gh:syncConfig,d:deployConfig})!==before;
  }catch(err){console.warn('Cloud registry pull failed:',err);return false;}
}
async function sbUpsertAppConfig(){
  const body=JSON.stringify({key:'cloud',value:cloudRegistryFull(),updated_at:stampNow(),updated_by:sbSession&&sbSession.user?sbSession.user.id:null});
  const res=await fetch(sbRoot()+'/rest/v1/app_config?on_conflict=key',{method:'POST',headers:{...sbHeaders(),Prefer:'resolution=merge-duplicates,return=minimal'},body});
  if(!res.ok)throw Error('School cloud config write failed (HTTP '+res.status+').');
}
async function githubWriteCloudConfig(){
  const repo=String(deployConfig.websiteRepo||'').trim();
  if(!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repo))throw Error('Website repository is not set.');
  if(!syncConfig.token)throw Error('A GitHub token is required to publish cloud-config.json.');
  const text=JSON.stringify(cloudConfigPublic(),null,2)+'\n';
  const base='https://api.github.com/repos/'+repo+'/contents/cloud-config.json';
  const headers={Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',Authorization:'Bearer '+syncConfig.token,'Content-Type':'application/json'};
  const gres=await fetch(base,{headers});
  let sha;
  if(gres.ok){const j=await gres.json();if(!Array.isArray(j))sha=j.sha;}
  else if(gres.status!==404)throw Error('Website repository read failed (HTTP '+gres.status+').');
  const body={message:'Update cloud-config.json from Report Studio',content:bytesToBase64(text),branch:'main'};
  if(sha)body.sha=sha;
  const res=await fetch(base,{method:'PUT',headers,body:JSON.stringify(body)});
  if(!res.ok)throw Error('cloud-config.json write failed (HTTP '+res.status+'). The token needs Contents: Read and write on '+repo+'.');
  const back=await fetch(base+'?ref=main&t='+Date.now(),{headers});
  if(!back.ok)throw Error('cloud-config.json was written but could not be read back (HTTP '+back.status+').');
  const backJson=await back.json();
  const backText=backJson&&backJson.content?base64ToText(backJson.content):'';
  if(!backText.includes('"supabaseUrl"')&&cloudConfigPublic().supabaseUrl)throw Error('cloud-config.json read back did not contain the saved settings. Try again.');
  bootstrapState.checked=true;bootstrapState.found=true;bootstrapState.at=new Date().toISOString();
}
function downloadCloudConfig(){
  const text=JSON.stringify(cloudConfigPublic(),null,2)+'\n';
  try{
    const blob=new Blob([text],{type:'application/json;charset=utf-8'});
    if(typeof URL==='undefined'||!URL.createObjectURL)throw Error('Blob URL unsupported');
    const url=URL.createObjectURL(blob),link=document.createElement('a');
    link.href=url;link.download='cloud-config.json';document.body.appendChild(link);link.click();link.remove();
    setTimeout(()=>{try{URL.revokeObjectURL(url);}catch(err){}},60000);
  }catch(err){
    const link=document.createElement('a');
    link.href='data:application/json;charset=utf-8,'+encodeURIComponent(text);
    link.download='cloud-config.json';document.body.appendChild(link);link.click();link.remove();
  }
  toast('cloud-config.json downloaded — commit it to the website repository.');
}
async function saveCloudRegistry(){
  const notes=[];let published=0,hardFail=false;
  if(sbReady()){
    if(!sbSession)notes.push('School database: not published yet — sign in with a school admin account.');
    else if(sbSession.role!=='admin')notes.push('School database: not published — only the school admin account can publish.');
    else{
      try{await sbUpsertAppConfig();published++;notes.push('School database: published (admins only).');}
      catch(err){
        const msg=String((err&&err.message)||err);
        if(/404|does not exist|relation|42P01/i.test(msg)){
          notes.push('School database: the app_config table is missing — re-run supabase-setup.sql in the Supabase SQL editor. Report data still syncs normally.');
        }else{hardFail=true;notes.push('School database: '+msg);}
      }
    }
  }
  if(syncConfig.token&&deployConfig.websiteRepo){
    try{await githubWriteCloudConfig();published++;notes.push('Website repository: cloud-config.json published.');}
    catch(err){notes.push('Website repository: not published — '+String((err&&err.message)||err)+' Use “Download cloud-config.json” instead.');}
  }else if(deployConfig.websiteRepo){
    notes.push('Website repository: not published yet — add a GitHub token with Contents access to '+deployConfig.websiteRepo+'.');
  }
  const box=document.getElementById('registry-text');
  if(box){box.textContent=notes.join(' · ');box.className='notice '+(hardFail?'red':'blue');box.hidden=false;}
  if(published)toast('Cloud configuration published to '+(published>1?'2 places':published===1&&sbReady()?'the school database':'the website')+'.');
  else if(hardFail)toast('Cloud configuration could not be published — see the note under Shared device setup.','error');
  else toast('This device is connected. Publishing to other computers needs one more step — see the note under Shared device setup.');
}

const ghTransport={

  readOne:async path=>{const f=await ghGetFile(path);return f&&typeof f.payload==='object'?{payload:f.payload,meta:String(f.sha||'')}:null;},
  write:async(path,payload,meta)=>{const text=JSON.stringify({version:1,updatedAt:stampNow(),...payload},null,2)+'\n';await ghPutFile(path,text,meta||undefined,'Sync '+path+' from Report Studio');}
};

function cloudReason(){
  const backend=cloudConfig.backend||'';
  if(syncState.status==='error'&&syncReady())return {state:'error',text:'Connected, but the last sync failed.',hint:syncState.lastError||'Press Sync now to try again.'};
  if(backend==='supabase'){
    if(!sbReady())return {state:'off',text:'School cloud is not configured on this device.',hint:'Enter the project URL and anon key below, or open the website copy that includes cloud-config.json.'};
    if(!sbSession)return {state:'signin',text:'School cloud is configured — sign in with a school account to connect.',hint:'Until then this computer keeps working offline and does not share data.'};
    return {state:'ok',text:'Connected to the school cloud.',hint:''};
  }
  if(backend==='github'){
    if(!ghReady())return {state:'off',text:'GitHub sync is not configured on this device.',hint:'Enter the repository and access token below, or publish cloud-config.json.'};
    return {state:'ok',text:'Connected to the GitHub data repository.',hint:''};
  }
  if(sbReady())return {state:'signin',text:'School cloud is configured — sign in with a school account to connect.',hint:'The cloud settings are saved; only the sign-in is missing.'};
  if(ghReady())return {state:'ok',text:'Connected to the GitHub data repository.',hint:''};

}

function stampNow(){return new Date().toISOString();}
function bytesToBase64(str){const bytes=new TextEncoder().encode(str);let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(bin);}

function ghApi(url,opts={},token){return fetch(url,{...opts,headers:{Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',Authorization:'Bearer '+(token||syncConfig.token),'Content-Type':'application/json',...(opts.headers||{})}});}
function ghRepoUrl(path){return 'https://api.github.com/repos/'+syncConfig.repo+(path?'/'+path:'');}

async function ghGetFile(filePath){const res=await ghApi(ghRepoUrl('contents/'+ghEncodePath(filePath)+'?ref='+encodeURIComponent(syncConfig.branch||'main')));if(res.status===404)return null;if(!res.ok)throw Error('GitHub read failed (HTTP '+res.status+').');const j=await res.json();if(Array.isArray(j))return j;const text=base64ToText(j.content);return {sha:j.sha,text,payload:safeJSON(text)};}
async function ghListDir(dirPath){const res=await ghApi(ghRepoUrl('contents/'+ghEncodePath(dirPath)+'?ref='+encodeURIComponent(syncConfig.branch||'main')));if(res.status===404)return [];if(!res.ok)throw Error('GitHub read failed (HTTP '+res.status+').');const j=await res.json();return Array.isArray(j)?j:[];}
async function ghPutFile(filePath,text,sha,message){const body={message, content:bytesToBase64(text), branch:syncConfig.branch||'main'};if(sha)body.sha=sha;const res=await ghApi(ghRepoUrl('contents/'+ghEncodePath(filePath)),{method:'PUT',body:JSON.stringify(body)});if(res.status===409){const err=Error('Another device updated this file first.');err.conflict=true;throw err;}if(!res.ok)throw Error('GitHub write failed (HTTP '+res.status+').');return res.json();}

function reportEntriesFor(subId){const out={};for(const stId of Object.keys(data.reports||{})){const rec=data.reports[stId]&&data.reports[stId][subId];if(rec)out[stId]=rec;}return out;}

function tsOf(x){const t=Date.parse(String((x&&x.updatedAt)||''));return Number.isFinite(t)?t:0;}

function pruneData(){

async function pushRemote(){
  if(!syncReady()||syncState.pushing)return;
  syncState.pushing=true;syncState.status='syncing';updateSyncUI();
  try{
    const t=transport();if(!t)throw Error('Cloud sync is not configured.');
    if(cloudConfig.backend==='supabase')await sbEnsureSession();
    for(let attempt=0;attempt<2;attempt++){
      const payloads=buildSyncPayloads();
      let conflict=false;
      for(const path of Object.keys(payloads)){
        const localStr=JSON.stringify(payloads[path]);
        if(syncedFiles[path]===localStr)continue;
        let remote=null;
        try{remote=await t.readOne(path);}catch(err){if(attempt===0)throw err;remote=null;}
        let merged=payloads[path];
        if(remote&&typeof remote.payload==='object'){
          const remoteStr=JSON.stringify(remote.payload);
          if(remoteStr!==localStr&&remoteStr!==(syncedFiles[path]||''))merged=mergePayload(path,remote.payload,payloads[path]);
        }
        try{await t.write(path,merged,remote&&remote.meta);}
        catch(err){if(err.conflict&&attempt===0){conflict=true;break;}throw err;}
        applyPayload(path,merged);
        syncedFiles[path]=JSON.stringify(payloadFor(path));
      }
      if(!conflict)break;
    }
    saveSyncCache();pruneData();try{localStorage.setItem(STORE_KEY,JSON.stringify(data));}catch(err){}syncState.status='ok';syncState.lastSync=stampNow();syncState.lastError='';
    if(cloudConfig.backend==='supabase'&&ghReady())mirrorToGitHub();
  }catch(err){syncState.status='error';syncState.lastError=(err&&err.message)||'Sync failed.';console.warn('Cloud sync push failed:',err);}
  finally{syncState.pushing=false;updateSyncUI();}
}
async function pullRemote(){
  if(!syncReady())return false;
  syncState.status='syncing';updateSyncUI();
  try{
    const t=transport();if(!t)throw Error('Cloud sync is not configured.');
    if(cloudConfig.backend==='supabase')await sbEnsureSession();
    const paths=new Set(syncFileList());
    try{for(const p of await t.list())paths.add(p);}catch(err){/* reports folder may not exist yet */}
    for(const path of paths){
      const remote=await t.readOne(path);
      if(!remote||typeof remote.payload!=='object')continue;
      const merged=mergePayload(path,remote.payload,payloadFor(path));
      applyPayload(path,merged);
      syncedFiles[path]=JSON.stringify(payloadFor(path));
    }
    saveSyncCache();pruneData();
    try{localStorage.setItem(STORE_KEY,JSON.stringify(data));}catch(err){}
    syncState.status='ok';syncState.lastSync=stampNow();syncState.lastError='';
    return true;
  }catch(err){syncState.status='error';syncState.lastError=(err&&err.message)||'Cloud pull failed.';console.warn('Cloud sync pull failed:',err);return false;}
  finally{updateSyncUI();}
}

function renderLogin(){document.body.classList.remove('preview-mode');stage.innerHTML='';modalRoot.innerHTML='';const cloudOn=sbReady(),choosing=ui.loginView!=='form',role=ui.loginRole==='admin'?'admin':ui.loginRole==='cloud'?'cloud':'teacher',roleLabel=role==='cloud'?'School account':role==='admin'?'Admin':'Teacher';const roleButtons=`<div class="login-roles">${cloudOn?'<button class="btn btn-primary btn-login" data-action="login-as" data-role="cloud">School account login</button>':''}<button class="btn ${cloudOn?'btn-secondary':'btn-primary'} btn-login" data-action="login-as" data-role="teacher">Teacher login (local)</button><button class="btn btn-gold btn-login" data-action="login-as" data-role="admin">Admin login (local)</button></div>${ui.loginNotice?`<div class="notice blue" style="margin:14px 0 0">${escapeHTML(ui.loginNotice)}</div>`:''}`;const setupBlock=!cloudOn?`<p class="muted" style="margin:14px 0 0">School cloud: <strong>not set up on this computer</strong>. The coordinator can connect it once below — it is then shared with every computer.</p><details class="cloud-setup"><summary>Coordinator: connect the school cloud</summary><form id="cloud-setup-form" class="login-form"><div class="field"><label for="cs-url">Supabase project URL</label><input id="cs-url" name="url" value="${escapeHTML(sbConfig.url||'')}" placeholder="https://xxxx.supabase.co"></div><div class="field"><label for="cs-anon">Anon public key</label><input id="cs-anon" name="anon" value="${escapeHTML(sbConfig.anon||'')}" placeholder="eyJhbGciOi…"></div><button type="submit" class="btn btn-gold">Connect school cloud</button></form></details>`:'';app.innerHTML=`<div class="login-shell"><div class="login-card"><img class="login-emblem" src="${SEED.assets.emblem}" alt="School emblem"><p class="eyebrow">Year 11 · Preliminary</p><h1>Student Report Studio</h1><p class="login-sub">${escapeHTML(data.schoolEn)}<br>${escapeHTML(data.schoolCn)}</p>${choosing?roleButtons:`<form id="login-form" class="login-form" autocomplete="on"><input type="hidden" name="role" value="${role}"><h2 class="login-form-title">${roleLabel} login</h2><div class="field"><label for="login-user">${role==='cloud'?'Username or email':'Username'}</label><input id="login-user" name="username" autocomplete="username" required></div><div class="field"><label for="login-pass">Password</label><input id="login-pass" name="password" type="password" autocomplete="current-password" required></div>${ui.loginError?`<div class="login-error" role="alert">${escapeHTML(ui.loginError)}</div>`:''}<div class="form-actions"><button type="button" class="btn btn-secondary" data-action="login-back">← Back</button><button type="submit" class="btn btn-primary">Sign in</button></div></form>`}${setupBlock}<p class="login-note">Access is for authorised staff only. School accounts are verified by the school cloud and every save is stored there; local logins keep working offline in this browser.</p></div></div>`;const first=app.querySelector('#login-user');if(first)first.focus();}
async function doLogin(form){const fd=new FormData(form),role=String(fd.get('role')||'teacher'),user=String(fd.get('username')||''),pass=String(fd.get('password')||'');
  if(role==='cloud'){
    try{
      if(!sbReady()){ui.loginError='School cloud is not configured on this device.';ui.loginView='choose';renderLogin();return;}
      await sbSignIn(user,pass);
      ui.loginError='';ui.loginNotice='';authRole=sbSession&&sbSession.role==='admin'?'admin':'teacher';writeAuth(authRole);
      ui.view=authRole==='admin'?'admin':'overview';ui.adminTab='settings';ui.subjectId=null;ui.editStudentId=null;
      render();window.scrollTo(0,0);
      toast('Signed in as '+(sbSession&&(sbSession.display_name||sbSession.username)||user)+'.');
      syncState.status='idle';syncState.lastError='';
      pullCloudRegistry().then(()=>{chooseBackend();bootSync();});
    }catch(err){ui.loginRole='cloud';ui.loginView='form';ui.loginError=(err&&err.message)||'Sign-in failed.';renderLogin();}
    return;
  }
  const normRole=role==='admin'?'admin':'teacher';
  if(!checkCredentials(user,pass,normRole)){ui.loginRole=normRole;ui.loginView='form';ui.loginError='Incorrect username or password.';renderLogin();return;}
  ui.loginError='';authRole=normRole;writeAuth(normRole);ui.view=normRole==='admin'?'admin':'overview';ui.adminTab='settings';ui.subjectId=null;ui.editStudentId=null;const autoBackend=chooseBackend();render();window.scrollTo(0,0);toast(normRole==='admin'?'Signed in as admin.':'Signed in as teacher.');if(autoBackend)bootSync();}
function saveCloudSetup(form){const fd=new FormData(form);const url=String(fd.get('url')||'').trim().replace(/\/+$/,''),anon=String(fd.get('anon')||'').trim();if(!/^https:\/\/.+/.test(url)||!anon){toast('Enter the Supabase project URL and anon public key.','error');return;}saveSbConfig({url,anon,enabled:true});saveCloudConfig({backend:'supabase'});syncState.status='idle';syncState.lastError='';ui.loginView='choose';ui.loginError='';ui.loginNotice='';renderLogin();toast('School cloud connected on this device. Sign in with your school account.');}

function render(){if(!authRole){renderLogin();return;}document.body.classList.remove('preview-mode');const title={overview:'Overview',admin:'Administration',subjects:'Subject entry',reports:'Student reports',sync:'Cloud sync',help:'Help & publishing'}[ui.view]||'Overview';app.innerHTML=`<div class="app-shell"><aside class="sidebar"><div class="side-brand"><img src="${SEED.assets.emblem}" alt="School emblem"><div><strong>Student Report<br>Studio</strong><span>Year 11 · Preliminary</span></div></div><div class="side-section">Workspace</div><nav class="nav-list" aria-label="Main navigation">${navButton('overview','▦','Overview')}${navButton('subjects','▤','Subject entry')}${navButton('reports','▧','Generate reports')}${navButton('admin','⚙',authRole==='admin'?'Admin':'Admin 🔒')}${navButton('sync','⇅','Cloud sync')}${navButton('help','?','Help & setup')}</nav><div class="sidebar-footer"><strong>${syncReady()?'Cloud-shared workspace':'Local-first workspace'}</strong>${cloudConfig.backend==='supabase'?'School accounts share report data through the school cloud.'+((sbSession&&sbSession.username)?' Signed in as '+escapeHTML(sbSession.username)+'.':''):cloudConfig.backend==='github'&&syncReady()?'Report data syncs through the private repository '+escapeHTML(syncConfig.repo)+'.':'Connect Cloud sync to share records through the school cloud or a private GitHub repository. GitHub Pages hosts the app only.'}</div></aside><div class="main-wrap"><header class="topbar"><div class="topbar-title">${escapeHTML(data.schoolEn)} <span style="color:#9ca9bb;font-weight:500">/</span> Report Studio</div><div class="topbar-meta"><span class="pill">${authRole==='admin'?'Admin session':'Teacher session'}</span><span class="pill ${ui.storageAvailable?'':'warning'}">${ui.storageAvailable?'Saved in this browser':'Storage unavailable'}</span><span class="pill warning">${escapeHTML(data.academicYear)} · Stage 6</span><span class="pill${syncPillClass()?' warning':''}" id="sync-pill">${syncPillText()} =4&&r.profile.every(x=>RATING[x]);return `<tr><td>${escapeHTML(label(st))}</td><td><span class="grade-badge ${r.overallGrade?'':'blank'}">${escapeHTML(r.overallGrade||'—')}</span></td><td>${scored}/${s.criteria.length}</td><td>${profileDone?profileTotal(r)+'/16':'Not set'}</td><td>${r.comment.trim()?'Entered':'Missing'}</td><td>${subjectReportButtons(st,s)}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No students are enrolled in this subject yet.</div>'}<div class="notice blue" style="margin-top:16px">PDFs are generated on this device. They do not upload grades to GitHub or sync data across computers. Share downloaded reports only through an approved private channel.</div></div>`;
}
function renderAdminData(){return `<div class="two-col"><div class="section-card"><h2>Export and import</h2><p class="lead" style="margin-bottom:19px">JSON transfers are how teachers work on separate browsers in the local-only version.</p><div class="details-list"><div><span>Full workspace backup (private)</span><button class="btn btn-small btn-secondary" data-action="export-all">Export all JSON</button></div><div><span>Import backup, teacher starter or subject entries</span><button class="btn btn-small btn-secondary" data-action="import-json">Import JSON</button></div><div><span>Delete this browser's stored records</span><button class="btn btn-small btn-danger" data-action="reset-all">Reset local data</button></div></div><input type="file" id="json-import" accept=".json,application/json" hidden><div class="notice red" style="margin-top:17px"><strong>Sensitive data:</strong> backups include student names and results. Do not add them to a public GitHub repository, send them in unapproved email or store them on a shared computer.</div></div><div class="section-card"><h2>Teacher handoff</h2><ol class="step-list"><li><span class="step-text">Admin completes setup, then exports a separate <strong>Teacher starter</strong> from the Subjects tab for each course. Each starter contains only that subject’s roster and criteria, not other students’ results.</span></li><li><span class="step-text">Each teacher imports their own starter in Admin → Data transfer, then enters only their subject’s reports.</span></li><li><span class="step-text">Each teacher uses <strong>Export subject entries</strong> in their subject view.</span></li><li><span class="step-text">Admin imports each subject package to merge teacher entries into the master copy.</span></li><li><span class="step-text">Admin exports another private full backup after all packages are merged.</span></li></ol><p class="footer-note">A subject package matches stable student and subject IDs from the admin’s starter file. If the roster changes, resend a fresh starter to teachers. Never share the admin’s full backup as a teacher starter.</p></div></div>`;}
function renderSubjects(){if(ui.editStudentId&&ui.subjectId)return renderEditor();if(ui.subjectId)return renderRoster();return `<div class="page-heading"><div><p class="eyebrow">Subject entry</p><h1>Choose a course</h1><p class="lead">Open your subject roster to record learning-criteria grades, the overall grade, four learner-profile ratings and a teacher comment.</p></div></div><div class="subject-grid">${data.subjects.map(s=>{const students=roster(s.id),done=students.filter(st=>completeReport(st,s)).length,pct=students.length?Math.round(done/students.length*100):0;return `<article class="subject-card"><div class="subject-card-head"><h3>${escapeHTML(s.name)}</h3><span class="subject-code">${escapeHTML(s.code)}</span></div><div class="teacher">${escapeHTML(s.teachers||'Teacher not yet assigned by admin')} · ${unitsText(s.units)}</div><div class="progress"><span style="width:${pct}%"></span></div><div class="foot"><small>${done}/${students.length} student reports complete</small><button class="btn btn-small btn-primary" data-action="open-subject" data-id="${escapeHTML(s.id)}">Enter reports →</button></div><div class="subject-quick"><button class="btn btn-small btn-secondary" data-action="preview-class" data-subject="${escapeHTML(s.id)}">Preview class</button><button class="btn btn-small btn-secondary" data-action="download-class" data-subject="${escapeHTML(s.id)}">Download class PDF</button></div></article>`}).join('')}</div>${!data.students.length?'<div class="notice" style="margin-top:19px">Admin must add the student roster and enrolments before teacher entry can begin.</div>':''}`;}
function renderRoster(){
 const s=data.subjects.find(x=>x.id===ui.subjectId);
 if(!s){ui.subjectId=null;return renderSubjects();}
 const students=roster(s.id),c=cohort(s.id);
 return `<div class="crumb"><button data-action="back-subjects">Subject entry</button> / ${escapeHTML(s.name)}</div><div class="roster-header"><div><p class="eyebrow">${escapeHTML(s.code)} · ${unitsText(s.units)}</p><h1>${escapeHTML(s.name)}</h1><p class="lead">${escapeHTML(s.teachers||'Teacher not set')} · ${students.length} enrolled student${students.length===1?'':'s'} · ${c.graded}/${c.total} overall grades entered</p></div><div class="actions"><button class="btn btn-secondary" data-action="preview-class" data-subject="${escapeHTML(s.id)}">Preview class report</button><button class="btn btn-gold" data-action="download-class" data-subject="${escapeHTML(s.id)}">Download class PDF</button><button class="btn btn-secondary" data-action="export-subject" data-id="${escapeHTML(s.id)}">Export subject entries</button></div></div><div class="section-card"><div class="card-title"><div><h2>Student roster</h2><p>Edit an entry or preview and download that student's individual subject report.</p></div><span class="soft-tag ${c.graded===c.total&&c.total?'green':'gold'}">${c.graded}/${c.total} graded</span></div>${students.length?`<div class="table-scroll"><table class="data-table"><thead><tr><th>Student</th><th>Overall grade</th><th>Entry</th><th>Actions</th></tr></thead><tbody>${students.map(st=>{const r=getReport(st.id,s.id),done=completeReport(st,s);return `<tr><td>${escapeHTML(label(st))}</td><td><span class="grade-badge ${r.overallGrade?'':'blank'}">${escapeHTML(r.overallGrade||'—')}</span></td><td><span class="soft-tag ${done?'green':'gold'}">${done?'Complete':'In progress'}</span></td><td><div class="actions subject-action-group"><button class="btn btn-small btn-primary" data-action="edit-entry" data-id="${escapeHTML(st.id)}">Edit report</button>${subjectReportButtons(st,s)}</div></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No students are enrolled in this subject. Admin can assign them in the roster.</div>'}</div>`;
}
function selectHTML(name,value,opts,placeholder='Select…'){return `<select name="${name}"><option value="">${placeholder}</option>${opts.map(opt=>`<option value="${escapeHTML(opt)}" ${value===opt?'selected':''}>${escapeHTML(opt)}</option>`).join('')}</select>`;}
function renderEditor(){const sub=data.subjects.find(x=>x.id===ui.subjectId),st=data.students.find(x=>x.id===ui.editStudentId);if(!sub||!st){ui.editStudentId=null;return renderRoster();}const r=getReport(st.id,sub.id),students=roster(sub.id),pos=students.findIndex(x=>x.id===st.id);return `<div class="crumb"><button data-action="back-subjects">Subject entry</button> / <button data-action="back-roster">${escapeHTML(sub.name)}</button> / ${escapeHTML(label(st))}</div><div class="editor-top"><div><p class="eyebrow">${escapeHTML(sub.code)} · Student ${pos+1} of ${students.length}</p><h1>${escapeHTML(label(st))}</h1><p class="lead">${escapeHTML(sub.name)} · ${escapeHTML(sub.teachers||'Teacher not assigned')}</p></div><span class="soft-tag ${completeReport(st,sub)?'green':'gold'}">${completeReport(st,sub)?'Complete':'In progress'}</span></div><form id="teacher-report-form" data-student="${escapeHTML(st.id)}" data-subject="${escapeHTML(sub.id)}"><div class="editor-grid"><div><section class="section-card"><div class="card-title"><div><h2>Learning criteria</h2><p>Choose an A–E achievement level for every criterion.</p></div></div>${sub.criteria.length?sub.criteria.map((text,i)=>`<div class="criterion-row"><span><strong style="color:var(--gold);margin-right:6px">${String(i+1).padStart(2,'0')}</strong>${escapeHTML(text)}</span>${selectHTML('crit_'+i,r.criteriaGrades[i]||'',GRADES,'—')}</div>`).join(''):'<div class="notice red">No learning criteria configured. Ask admin to add criteria for this subject.</div>'}</section><section class="section-card"><div class="card-title"><div><h2>Teacher comment</h2><p>Write the student's strengths, areas for development and next steps.</p></div></div><div class="field"><label for="comment-box">Comment for ${escapeHTML(st.english)}</label><textarea id="comment-box" name="comment" rows="12" maxlength="3000" placeholder="Write the student comment here…">${escapeHTML(r.comment)}</textarea><small>Blank lines create paragraphs. A line beginning <span class="code">##</span> becomes a small heading; a line beginning <span class="code">-</span> becomes a bullet. Maximum 3,000 characters; review the report preview before printing.</small></div></section></div><div><section class="section-card"><h2>Overall grade</h2><p class="lead" style="margin-bottom:12px">Awarded across the course; this is separate from the learner profile.</p><div class="field"><label for="overall-select">A–E grade</label><div id="overall-select">${selectHTML('overallGrade',r.overallGrade,GRADES)}</div></div><div class="divider"></div><h2>Learner profile</h2><p class="lead" style="margin-bottom:14px">Select a frequency rating for each area.</p>${PROFILE_LABELS.map((text,i)=>`<div class="profile-edit-row"><div>${escapeHTML(text.split(':')[0])}<div class="desc">${escapeHTML(text.split(':').slice(1).join(':').trim())}</div></div>${selectHTML('profile_'+i,r.profile[i]||'',Object.keys(RATING))}</div>`).join('')}</section><div class="notice blue">The A–E cohort distribution in the final report is calculated automatically from all enrolled students' overall grades. ${cohort(sub.id).graded}/${cohort(sub.id).total} are currently graded.</div></div></div><div class="sticky-actions"><div class="editor-status" id="editor-status">Changes are saved when you click Save.</div><div class="actions"><button type="button" class="btn btn-secondary" data-action="back-roster">Back to roster</button><button type="button" class="btn btn-secondary" data-action="preview-subject" data-id="${escapeHTML(st.id)}" data-subject="${escapeHTML(sub.id)}">Preview</button><button type="button" class="btn btn-gold" data-action="download-subject" data-id="${escapeHTML(st.id)}" data-subject="${escapeHTML(sub.id)}">Download PDF</button><button class="btn btn-primary" type="submit" name="saveMode" value="stay">Save entry</button>${pos<students.length-1?'<button class="btn btn-gold" type="submit" name="saveMode" value="next">Save & next →</button>':''}</div></div></form>`;}
function renderReports(){
 const selected=data.students.find(x=>x.id===ui.reportStudentId)||sortedStudents()[0];
 if(selected)ui.reportStudentId=selected.id;
 const issues=selected?issueList(selected):[];
 const selection=selected?`<div class="field" style="margin:14px 0 18px"><label for="report-student">Student</label><select id="report-student">${sortedStudents().map(st=>`<option value="${escapeHTML(st.id)}" ${selected.id===st.id?'selected':''}>${escapeHTML(label(st))}</option>`).join('')}</select></div><div class="details-list"><div><span>Subjects enrolled</span><span>${enrolled(selected).length}</span></div><div><span>Report entries complete</span><span>${enrolled(selected).filter(s=>completeReport(selected,s)).length}/${enrolled(selected).length}</span></div><div><span>Preliminary units</span><span>${enrolled(selected).reduce((a,s)=>a+Number(s.units||0),0)}</span></div><div><span>Overall readiness</span><span>${issues.length?'Draft / incomplete':'Ready to print'}</span></div></div><div class="form-actions"><button class="btn btn-secondary" data-action="preview" data-id="${escapeHTML(selected.id)}">Preview report</button><button class="btn btn-primary" data-action="generate-pdf" data-id="${escapeHTML(selected.id)}">Generate PDF ↗</button></div>`:'<div class="empty">Add a student in Admin before generating reports.</div>';
 const checklist=!selected?'<p class="lead">Select a student to check report readiness.</p>':issues.length?`<div class="notice" style="margin-top:14px"><strong>${issues.length} item${issues.length===1?'':'s'} need attention.</strong> You can preview or print a clearly marked draft, but the final report should be completed first.</div><ul style="font-size:12px;color:#526278;line-height:1.7;padding-left:20px">${issues.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ul>`:'<div class="notice blue" style="margin-top:14px"><strong>Ready.</strong> All required fields are complete and each subject’s cohort grade distribution is final.</div>';
 return `<div class="page-heading"><div><p class="eyebrow">PDF reports</p><h1>Generate a student report</h1><p class="lead">Preview the branded A4 layout, then choose Save as PDF in the browser print dialog.</p></div></div><div class="two-col"><section class="section-card"><h2>Select student</h2>${selection}</section><section class="section-card"><h2>Final-report checklist</h2>${checklist}<p class="footer-note">The print command uses A4 paper. In the print dialog choose <strong>Save as PDF</strong>, set margins to <strong>None</strong>, turn off browser headers and footers, and enable <strong>Background graphics</strong> so school colours print correctly.</p></section></div>${selected?`<div class="section-card"><div class="card-title"><div><h2>Optional profile summary</h2><p>Admin may tailor the strengths and development panels on this student's report. If left blank, a neutral data-based summary is used.</p></div></div>${renderSummaryForm(selected)}</div>`:''}`;
